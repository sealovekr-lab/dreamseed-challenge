/* 소리 우선순위: ① 선생님이 정한 소리 파일(줄별 파일 / 단어 낭독 파일 구간 / 전체 음원 구간) → ② 관리자가 확인한 기기 음성 → ③ 없음(안내) */
/* 소리 파일(전용 음원·단어 낭독 파일·줄별 소리·기존 음원 구간)로 이 줄을 들려줄 수 있으면 {kind,start,end,player} */
function rowFile(row, sec, lang){
  sec = sec || App.section; lang = lang || App.lang;
  var kind = Core.rowFileKind(sec, row);
  if(!kind) return null;
  if(kind === 'clip'){
    var cs = App.srcs['c:' + row.clip.id], cp = ClipPlayers[row.clip.id];
    return (cs && cs.status === 'ok' && cp) ? { kind: kind, start: 0, end: row.clip.dur + 0.3, player: cp } : null;   // 파일 끝에서 저절로 멈춤(여유 0.3초)
  }
  if(kind === 'words'){
    var ws = App.srcs['c:' + sec.wordsAudio.id], wp = ClipPlayers[sec.wordsAudio.id];
    return (ws && ws.status === 'ok' && wp) ? { kind: kind, start: row.wstart, end: row.wend, player: wp } : null;
  }
  if(sec.own){
    var os = App.srcs['c:' + sec.own.id], op = ClipPlayers[sec.own.id];
    return (os && os.status === 'ok' && op) ? { kind: 'main', start: row.start, end: row.end, player: op } : null;
  }

var Rec = { rec: null, stream: null, chunks: [], url: null, timer: null, sec: 0, state: 'idle' };
function recCleanup(full){
  if(Rec.timer){ clearInterval(Rec.timer); Rec.timer = null; }
  try{ if(Rec.rec && Rec.rec.state !== 'inactive') Rec.rec.stop(); }catch(e){}
  if(Rec.stream){ try{ Rec.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} Rec.stream = null; }
  Rec.rec = null;
  if(full){ if(Rec.url){ try{ URL.revokeObjectURL(Rec.url); }catch(e){} Rec.url = null; } Rec.state = 'idle'; Rec.chunks = []; Rec.sec = 0; }
}
function bindRecUi(){
  var box = document.getElementById('recUi');
  if(!box) return;
  var canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  if(!canRec){ box.innerHTML = '<div class="nosound">이 기기에서는 녹음을 할 수 없어요.</div>'; return; }
  if(Rec.state === 'recording'){
    box.innerHTML = '<div class="rec-timer" id="recTimer">● ' + Rec.sec + '초</div><button class="pbtn mic recording" data-act="rec-stop"><span>⏹</span><span class="lab">멈추기</span></button>';
  } else if(Rec.url){
    box.innerHTML = '<audio controls src="' + Rec.url + '"></audio><div class="rec-btns" style="margin-top:10px;"><button class="pbtn light" data-act="rec-start"><span>🎤</span><span class="lab">다시 녹음</span></button><button class="pbtn light" data-act="rec-reset"><span>🗑</span><span class="lab">지우기</span></button></div>';
  } else {
    box.innerHTML = '<button class="pbtn talk" data-act="rec-start"><span>🎤</span><span class="lab">녹음 시작</span></button>';
  }
}
async function recStart(){
  stopSounds();
  recCleanup(false);
  if(Rec.url){ try{ URL.revokeObjectURL(Rec.url); }catch(e){} Rec.url = null; }
  var stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ toast('마이크를 쓸 수 없어요. 마이크를 허용해 주세요.'); return; }
  Rec.stream = stream; Rec.chunks = []; Rec.sec = 0;
  var mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].filter(function(m){ return window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(m); })[0];
  try{ Rec.rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch(e){ toast('녹음을 시작하지 못했어요.'); recCleanup(true); return; }
  Rec.rec.ondataavailable = function(ev){ if(ev.data && ev.data.size) Rec.chunks.push(ev.data); };
  Rec.rec.onstop = function(){
    var blob = new Blob(Rec.chunks, { type: (Rec.rec && Rec.rec.mimeType) || mime || 'audio/webm' });
    if(Rec.stream){ try{ Rec.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} Rec.stream = null; }
    if(Rec.timer){ clearInterval(Rec.timer); Rec.timer = null; }
    Rec.url = blob.size ? URL.createObjectURL(blob) : null;
    Rec.state = 'idle'; Rec.rec = null;
    bindRecUi();
  };
  Rec.rec.start();
  Rec.state = 'recording';
  Rec.timer = setInterval(function(){
    Rec.sec++;
    var t = document.getElementById('recTimer'); if(t) t.textContent = '● ' + Rec.sec + '초';
    if(Rec.sec >= 60) recStop();
  }, 1000);
  bindRecUi();
}
function recStop(){ try{ if(Rec.rec && Rec.rec.state !== 'inactive') Rec.rec.stop(); }catch(e){} }

function stopEverything(keepRec){
  stopSounds();
  if(!keepRec || App.view !== 'lang' || App.step !== 3) recCleanup(true);
}

/* ---------- 클릭 처리 ---------- */
function findRow(kind, id){
  var sec = App.section;
  if(kind === 'w') return (sec.words || []).filter(function(x){ return x.id === id; })[0];
  if(kind === 'p') return (sec.phrases || []).filter(function(x){ return x.id === id; })[0];
  return sec.full;
}
function doPlay(btn){
  var kind = btn.getAttribute('data-kind'), id = btn.getAttribute('data-id'), mode = btn.getAttribute('data-mode');
  var pid = btn.getAttribute('data-pid');
  var row = findRow(kind, id);
  var sk = (kind === 'f') ? (rowMp3(row) ? 'mp3' : null) : soundOf(row);   // 전체 말씀은 MP3만
  if(!sk){ toast('소리를 준비하고 있어요.'); return; }
  if(isPlayingAny(pid)){ stopSounds(); return; }
  var times = (mode === 'f') ? 1 : parseInt(mode, 10) || 1;
  // "들었어요"는 여기서 처리하지 않음: 소리가 실제로 한 번 끝까지 나온 뒤 onPlayState('pass')에서 처리
  stopSounds();
  if(sk === 'mp3'){
    var rf = rowFile(row), dur = rf.kind === 'clip' ? row.clip.dur : rf.end - rf.start;
    rf.player.play(pid, rf.start, rf.end, {
      times: times, gapMs: 600, rate: App.slow ? 0.75 : 1,
      followMs: (mode === 'f') ? Math.round(Math.max(1500, dur * 1000 * 1.4 + 600)) : 0
    });
  } else {
    var txt = Core.speakText(App.lang, row);
    var est = App.lang === 'zh' ? Array.from(txt).length * 380 : txt.split(/\s+/).length * 520;
    Voice.play(pid, txt, App.lang, {
      times: times, gapMs: 600, rate: App.slow ? 0.75 : 1,
      followMs: (mode === 'f') ? Math.round(Math.max(1500, est * (App.slow ? 1.3 : 1) + 600)) : 0
    });
  }
}

  var p = getProg(App.lang, App.section);

    p.w[id] = 1; saveProg(App.lang, p);

    if(card){ card.classList.add('heard'); if(!card.querySelector('.check')){ var s = document.createElement('span'); s.className = 'check'; s.textContent = '✔'; card.insertBefore(s, card.firstChild); } }

document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(typeof adminClick === 'function' && adminClick(act, el, ev)) return;
  if(typeof quizClick === 'function' && quizClick(act, el, ev)) return;
  if(typeof archClick === 'function' && archClick(act, el, ev)) return;
  switch(act){
    case 'reload': boot(); break;
    case 'home': renderHome(); window.scrollTo(0, 0); break;
    case 'open-lang': {
      var lang = el.getAttribute('data-lang'), u = usableSection(lang);
      if(u.state === 'ready') openLang(lang, u.section, {}); else toast('아직 준비 중이에요');
      break;
    }
    case 'step': stopEverything(false); App.step = parseInt(el.getAttribute('data-n'), 10); renderLang(); break;
    case 'play': doPlay(el); break;
    case 'done-phrase': {
      var id = el.getAttribute('data-id'), p = getProg(App.lang, App.section);
      if(p.p[id]) delete p.p[id]; else p.p[id] = 1;
      saveProg(App.lang, p);
      var card = document.getElementById('pc-' + id);
      if(card){ card.classList.toggle('done', !!p.p[id]); }
      el.className = 'btn small donebtn ' + (p.p[id] ? 'leaf' : 'ghost'); el.textContent = p.p[id] ? '✅ 했어요' : '⬜ 다 했어요';
      refreshFinish();
      break;
    }
    case 'finish': if(!el.disabled) finishStep(parseInt(el.getAttribute('data-n'), 10)); break;
    case 'toggle-pinyin': App.pinyinOn = !App.pinyinOn; lsSet('dsStudyPinyin', App.pinyinOn ? '1' : '0'); stopSounds(); renderStep(); break;
    case 'toggle-slow': App.slow = !App.slow; el.classList.toggle('on', App.slow); el.textContent = '🐢 천천히 ' + (App.slow ? '✔' : ''); break;
    case 'toggle-mask': {
      App.masked = !App.masked;
      var ft = document.getElementById('fullText'), ph = document.getElementById('peekHint');
      if(ft) ft.classList.toggle('masked', App.masked);
      if(ph) ph.classList.toggle('hidden', !App.masked);

      break;
    }
    case 'rec-start': recStart(); break;
    case 'rec-stop': recStop(); break;
    case 'rec-reset': recCleanup(true); bindRecUi(); break;
    case 'retry-audio': (async function(){
      renderLoading('소리를 불러오는 중…');
      if(!App.section.own && !App.archive){ await ensureAudio(App.lang, true); attachAudio(App.lang); }
      await loadSectionSources(App.section, false);      // 이미 불러온 파일은 그대로, 실패한 파일만 다시
      renderLang();
    })(); break;
    case 'noop': break;
  }
});

/* ============================================================

   - 문제는 선생님이 게시한 단어·구절로만 만듦 (새 문장을 지어내지 않음)
   - 보석 기록: 이 기기('dsGems:<아이ID>')에 먼저 저장하고, 서버의 studyRoom/gems/<아이ID>/days/<날짜> 에도 올림
     (선생님이 보고 교환·조정 기록 adj/…, 교환표 studyRoom/gemsConfig 를 남김)
     → app_state·말씀정원(물방울/햇빛/열매)·녹음 기록·연습실 진행 기록(dsStudy)과 완전히 별개
   ============================================================ */
var Q = {};
Core.Q = Q;
Q.DAILY = 3;            // 하루 기본 문제 수
Q.MAXPAY = 2;           // 하루에 받을 수 있는 보석 최대 개수 (끝까지 풀기 1 + 모두 맞히기 보너스 1)
Q.HIST_DAYS = 40;       // 최근 문제 기록 보관 일수
Q.DETAIL_DAYS = 7;      // 이 기기에 문제 내용(qs/res)을 보관하는 일수 (보석 기록 요약은 계속 보관)
Q.nowFn = function(){ return new Date(); };

/* ---------- 순수 계산 (화면·저장과 무관) ---------- */
Q.hash = function(s){
  var h = 2166136261 >>> 0, i; s = String(s);
  for(i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
};
Q.rng = function(seed){
  var a = Q.hash(seed);
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
Q.shuffle = function(arr, rnd){
  var a = arr.slice(), i, j, t;
  for(i=a.length-1;i>0;i--){ j = Math.floor(rnd() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
};
Q.dateStr = function(d){
  d = d || Q.nowFn();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
};
Q.clean = function(s){ return String(s == null ? '' : s).trim(); };
Q.uniqueBy = function(list, keyFn){
  var seen = {}, out = [];
  list.forEach(function(x){ var k = keyFn(x); if(k && !seen[k]){ seen[k] = 1; out.push(x); } });
  return out;
};
function qzEsc(s){ return String(s == null ? '' : s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
Q.keyOf = function(lang, type, kind, id, id2){ return [lang, type, kind, id, id2 || ''].join('|'); };
Q.parseKey = function(key){ var p = String(key).split('|'); return { key: String(key), lang: p[0], type: p[1], kind: p[2], id: p[3], id2: p[4] || '' }; };

/* 문제 후보 목록: ctx = { langs: { en: {sec, canPlay(row)}, zh: {...} } } (준비된 언어만 들어 있음) */
Q.pool = function(ctx){
  var out = [];
  ['en', 'zh'].forEach(function(lang){
    var L = ctx.langs && ctx.langs[lang];
    if(!L || !L.sec) return;
    var W = (L.sec.words || []).filter(function(r){ return r && Q.clean(r.text); });
    var P = (L.sec.phrases || []).filter(function(r){ return r && Q.clean(r.text); });
    var cand = [];
    W.forEach(function(w){
      cand.push({ lang: lang, type: 'meaning', kind: 'w', id: w.id });
      cand.push({ lang: lang, type: 'reverse', kind: 'w', id: w.id });
      cand.push({ lang: lang, type: 'listen', kind: 'w', id: w.id });
      P.forEach(function(p){ cand.push({ lang: lang, type: 'blank', kind: 'p', id: p.id, id2: w.id }); });
    });
    P.forEach(function(p){ cand.push({ lang: lang, type: 'meaning', kind: 'p', id: p.id }); });
    cand.forEach(function(d){
      d.key = Q.keyOf(d.lang, d.type, d.kind, d.id, d.id2);
      if(Q.build(d, ctx, 'pool')) out.push(d);
    });
  });
  return out;
};

/* 한 문제 만들기. 만들 수 없으면 null. 같은 (desc, seed)면 항상 같은 문제 */
Q.build = function(desc, ctx, seed){
  var L = ctx.langs && ctx.langs[desc.lang];
  if(!L || !L.sec) return null;
  var sec = L.sec, lang = desc.lang, rnd = Q.rng(seed + '|' + desc.key);
  var W = (sec.words || []).filter(function(r){ return r && Q.clean(r.text); });
  var P = (sec.phrases || []).filter(function(r){ return r && Q.clean(r.text); });
  var rows = desc.kind === 'p' ? P : W;
  var row = rows.filter(function(r){ return r.id === desc.id; })[0];
  if(!row) return null;
  var other = { en: ctx.langs.en, zh: ctx.langs.zh };
  function opt(r, ok){ return { t: Q.clean(r.text), py: lang === 'zh' ? Q.clean(r.pinyin) : '', ok: !!ok }; }
  function finish(q, options){
    var shuffled = Q.shuffle(options, rnd);
    q.opts = shuffled;
    q.key = desc.key; q.lang = lang; q.type = desc.type; q.kind = desc.kind; q.row = row;
    return q;
  }

  if(desc.type === 'meaning'){
    var ko = Q.clean(row.ko);
    if(!ko) return null;
    // 같은 언어의 같은 종류(단어/구절)에서 먼저, 부족하면 다른 언어에서
    var pools = [rows];
    var o = lang === 'en' ? 'zh' : 'en';
    if(other[o] && other[o].sec) pools.push((desc.kind === 'p' ? other[o].sec.phrases : other[o].sec.words) || []);
    var ds = [];
    pools.forEach(function(arr){
      var c = arr.filter(function(r){ return r && r !== row && Q.clean(r.ko) && Core.normText(r.ko) !== Core.normText(ko); });
      ds = ds.concat(Q.shuffle(Q.uniqueBy(c, function(r){ return Core.normText(r.ko); }), rnd));
    });
    ds = Q.uniqueBy(ds, function(r){ return Core.normText(r.ko); });
    if(ds.length < 2) return null;
    var opts = [{ t: ko, py: '', ok: true }, { t: Q.clean(ds[0].ko), py: '', ok: false }, { t: Q.clean(ds[1].ko), py: '', ok: false }];
    return finish({ text: Q.clean(row.text), py: lang === 'zh' ? Q.clean(row.pinyin) : '', canPlay: !!(L.canPlay && L.canPlay(row)) }, opts);
  }

  if(desc.type === 'reverse' || desc.type === 'listen'){
    if(desc.kind !== 'w') return null;
    if(desc.type === 'reverse' && !Q.clean(row.ko)) return null;
    if(desc.type === 'listen' && !(L.canPlay && L.canPlay(row))) return null;
    var ds2 = Q.uniqueBy(W.filter(function(r){ return r !== row && Core.normText(r.text) !== Core.normText(row.text); }), function(r){ return Core.normText(r.text); });
    if(ds2.length < 2) return null;
    ds2 = Q.shuffle(ds2, rnd);
    var q2 = desc.type === 'reverse' ? { ko: Q.clean(row.ko) } : { sound: true };
    return finish(q2, [opt(row, true), opt(ds2[0], false), opt(ds2[1], false)]);
  }

  if(desc.type === 'blank'){
    if(desc.kind !== 'p') return null;
    var w = W.filter(function(r){ return r.id === desc.id2; })[0];
    if(!w) return null;
    var wt = Q.clean(w.text), pt = Q.clean(row.text), before, after, hit;
    if(lang === 'zh'){
      var at = pt.indexOf(wt);
      if(at < 0) return null;
      before = pt.slice(0, at); after = pt.slice(at + wt.length); hit = wt;
    } else {
      var m = new RegExp('(^|[^A-Za-z])(' + qzEsc(wt) + ')(?=[^A-Za-z]|$)', 'i').exec(pt);
      if(!m) return null;
      before = pt.slice(0, m.index + m[1].length); after = pt.slice(m.index + m[1].length + m[2].length); hit = m[2];
    }
    // 보기: 이 구절에 없는 다른 핵심 단어 → 부족하면 말씀 본문의 긴 단어
    var inPhrase = function(t){ return lang === 'zh' ? pt.indexOf(t) >= 0 : new RegExp('(^|[^A-Za-z])' + qzEsc(t) + '(?=[^A-Za-z]|$)', 'i').test(pt); };
    var dsw = W.filter(function(r){ return r !== w && Core.normText(r.text) !== Core.normText(wt) && !inPhrase(Q.clean(r.text)); }).map(function(r){ return { t: Q.clean(r.text), py: lang === 'zh' ? Q.clean(r.pinyin) : '' }; });
    if(lang === 'en' && dsw.length < 2){
      String(sec.text || '').split(/\s+/).forEach(function(tok){
        var c = tok.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '');
        if(c.length >= 5 && !inPhrase(c)) dsw.push({ t: c, py: '' });
      });
    }
    dsw = Q.uniqueBy(dsw, function(x){ return Core.normText(x.t); }).filter(function(x){ return Core.normText(x.t) !== Core.normText(hit); });
    if(dsw.length < 2) return null;
    dsw = Q.shuffle(dsw, rnd);
    return finish({ before: before, after: after, ko: Q.clean(row.ko), phraseText: pt },
      [{ t: hit, py: lang === 'zh' ? Q.clean(w.pinyin) : '', ok: true }, { t: dsw[0].t, py: dsw[0].py, ok: false }, { t: dsw[1].t, py: dsw[1].py, ok: false }]);
  }
  return null;
};

/* 오늘 낼 문제 고르기: 틀렸던 문제 1개(있으면) + 오래 안 나온 것부터, 같은 단어·같은 유형이 겹치지 않게, 두 언어가 섞이게 */
Q.pick = function(pool, o){
  var n = o.n, hist = o.hist || {}, today = o.today, rnd = Q.rng(o.seed), chosen = [], used = {};
  var fixed = o.fixedDescs || [], total = n + fixed.length;
  var byKey = {}; pool.forEach(function(d){ byKey[d.key] = d; });
  function itemOf(d){ return d.lang + '|' + d.kind + '|' + d.id; }
  function take(d){ chosen.push(d); used[d.key] = 1; }
  if(o.allowRetry){      // 전에 틀렸던 문제를 하루 한 번 다시 (오늘 이미 나온 것은 제외)
    (o.wrong || []).some(function(k){
      var d = byKey[k];
      if(d && hist[k] !== today && !used[k]){ take(d); return true; }
      return false;
    });
  }
  // 오래 안 나온 것부터 (한 번도 안 나온 것이 가장 먼저), 같은 조건끼리는 날짜 시드로 섞기
  var order = Q.shuffle(pool.filter(function(d){ return !used[d.key]; }), rnd);
  order.sort(function(a, b){ var x = hist[a.key] || '', y = hist[b.key] || ''; return x < y ? -1 : x > y ? 1 : 0; });
  var bothLangs = {}; pool.forEach(function(d){ bothLangs[d.lang] = 1; });
  bothLangs = Object.keys(bothLangs).length > 1;
  function passFn(level){
    return function(d){
      if(used[d.key]) return false;
      var base = chosen.concat(fixed);
      if(level <= 1 && base.some(function(c){ return itemOf(c) === itemOf(d); })) return false;          // 같은 단어·구절 겹침 방지
      if(level === 0 && base.some(function(c){ return c.type === d.type; })) return false;               // 같은 유형 겹침 방지
      if(level <= 1 && bothLangs && base.length === total - 1 && base.length > 0 && base.every(function(c){ return c.lang === d.lang; })) return false;   // 마지막 문제는 다른 언어로
      return true;
    };
  }
  [0, 1, 2].forEach(function(level){
    var f = passFn(level);
    order.forEach(function(d){ if(chosen.length < n && f(d)) take(d); });
  });
  return chosen;
};

Q.reward = function(n, okCount){
  if(!(n > 0)) return 0;
  return Math.min(Q.MAXPAY, 1 + (okCount === n ? 1 : 0));
};

/* ---------- 보석 기록 계산 (서버에서 읽은 값은 믿지 않고 범위를 다시 맞춤) ---------- */
Q.DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
Q.ID_RE = /^[A-Za-z0-9_-]{6,40}$/;
Q.int = function(x, lo, hi){ x = Math.round(+x); if(!isFinite(x)) return lo; return Math.max(lo, Math.min(hi, x)); };
Q.cleanDays = function(raw){
  var out = {};
  if(!raw || typeof raw !== 'object') return out;
  Object.keys(raw).forEach(function(d){
    var v = raw[d];
    if(!Q.DATE_RE.test(d) || !v || typeof v !== 'object') return;
    var n = Q.int(v.n, 0, 10), ok = Q.int(v.ok, 0, n);
    out[d] = { n: n, ok: ok, paid: Q.int(v.paid, 0, Q.MAXPAY), at: Q.int(v.at, 0, 9e15) };     // 하루 보석은 최대 2개로 맞춤
  });
  return out;
};
/* 선생님이 남긴 교환('x', 보석이 줄어듦) · 조정('a', 늘거나 줆) 기록. off=취소됨 */
Q.cleanAdj = function(raw){
  var list = [];
  if(!raw || typeof raw !== 'object') return list;
  Object.keys(raw).forEach(function(id){
    var v = raw[id];
    if(!Q.ID_RE.test(id) || !v || typeof v !== 'object') return;
    var k = v.k === 'x' ? 'x' : v.k === 'a' ? 'a' : null; if(!k) return;
    var d = Q.int(v.d, -1000, 1000); if(d === 0 || (k === 'x' && d > 0)) return;
    list.push({ id: id, k: k, d: d, reward: String(v.reward || '').slice(0, 20), memo: String(v.memo || '').slice(0, 60), at: Q.int(v.at, 0, 9e15), off: !!v.off, offAt: Q.int(v.offAt, 0, 9e15) });
  });
  list.sort(function(a, b){ return a.at - b.at || (a.id < b.id ? -1 : 1); });
  return list;
};
Q.cleanConfig = function(raw){
  var arr = [];
  if(raw && Array.isArray(raw.tiers)) arr = raw.tiers;
  else if(raw && raw.tiers && typeof raw.tiers === 'object') arr = Object.keys(raw.tiers).map(function(k){ return raw.tiers[k]; });
  var tiers = arr.filter(function(t){ return t && typeof t === 'object'; }).map(function(t){ return { n: Q.int(t.n, 1, 999), name: String(t.name || '').trim().slice(0, 20) }; }).filter(function(t){ return t.name; });
  tiers = Q.uniqueBy(tiers, function(t){ return String(t.n); }).sort(function(a, b){ return a.n - b.n; }).slice(0, 12);
  return { tiers: tiers };
};
Q.summary = function(days, adj){
  var earned = 0, ex = 0, ad = 0;
  Object.keys(days || {}).forEach(function(d){ earned += days[d].paid || 0; });
  (adj || []).forEach(function(a){ if(a.off) return; if(a.k === 'x') ex += -a.d; else ad += a.d; });
  return { earned: earned, exchanged: ex, adjusted: ad, balance: Math.max(0, earned - ex + ad) };
};
Q.lastDays = function(today, n){
  var out = [], base = new Date(today + 'T12:00:00'), i;
  for(i=0;i<n;i++){ out.push(Q.dateStr(new Date(base.getTime() - i * 86400000))); }
  return out;
};
Q.weekPaid = function(days, today){ return Q.lastDays(today, 7).reduce(function(a, d){ return a + ((days[d] && days[d].paid) || 0); }, 0); };
Q.lastQuizDay = function(days){ var ds = Object.keys(days || {}).filter(function(d){ return days[d].n > 0; }).sort(); return ds.length ? ds[ds.length - 1] : ''; };
Q.rewardStatus = function(balance, tiers){
  var can = tiers.filter(function(t){ return t.n <= balance; }), next = tiers.filter(function(t){ return t.n > balance; })[0] || null;
  return { can: can, next: next };
};
Q.mdLabel = function(ts){ var d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate(); };

/* ---------- 보석 저장: 이 기기에 먼저 → 서버(선생님도 볼 수 있게)에도 ---------- */
var Gems = {
  stored: true,        // 이 기기 저장이 되는지
  online: null,        // 마지막 서버 확인이 되었는지 (null=아직 모름)
  key: function(){ return 'dsGems:' + (App.child ? App.child.id : 'guest'); },
  blank: function(){ return { v: 2, days: {}, hist: {}, wrong: [], srv: { days: {}, adj: [], tiers: [], at: 0 } }; },
  load: function(){
    var d = null;
    try{ d = JSON.parse(lsGet(Gems.key()) || 'null'); }catch(e){ d = null; }
    if(!d || typeof d !== 'object') d = Gems.blank();
    if(!d.days || typeof d.days !== 'object') d.days = {};
    if(!d.hist || typeof d.hist !== 'object') d.hist = {};
    if(!Array.isArray(d.wrong)) d.wrong = [];
    if(!d.srv || typeof d.srv !== 'object') d.srv = { days: {}, adj: [], tiers: [], at: 0 };
    if(!d.srv.days || typeof d.srv.days !== 'object') d.srv.days = {};
    if(!Array.isArray(d.srv.adj)) d.srv.adj = [];
    if(!Array.isArray(d.srv.tiers)) d.srv.tiers = [];
    return d;
  },
  save: function(d){
    // 오래된 날의 문제 내용은 정리 (받은 보석 요약은 계속 남김)
    var cutStr = Q.dateStr(new Date(Q.nowFn().getTime() - Q.DETAIL_DAYS * 86400000));
    Object.keys(d.days).forEach(function(k){ if(k < cutStr && d.days[k].done){ delete d.days[k].qs; delete d.days[k].res; } });
    var hcut = Q.dateStr(new Date(Q.nowFn().getTime() - Q.HIST_DAYS * 86400000));
    Object.keys(d.hist).forEach(function(k){ if(d.hist[k] < hcut) delete d.hist[k]; });
    d.wrong = d.wrong.slice(-20);
    var txt = JSON.stringify(d);
    lsSet(Gems.key(), txt);
    Gems.stored = (lsGet(Gems.key()) === txt);
    return Gems.stored;
  },
  /* 받은 보석이 있는 날 모두 (서버 기록 + 이 기기에서 끝낸 날) */
  mergedDays: function(d){
    var out = {}, k;
    Object.keys(d.srv.days).forEach(function(x){ out[x] = d.srv.days[x]; });
    Object.keys(d.days).forEach(function(x){
      var e = d.days[x];
      if(e && e.done && !out[x]) out[x] = { n: e.n || (e.qs ? e.qs.length : 0), ok: e.ok || 0, paid: Math.min(Q.MAXPAY, e.paid || 0), at: 0 };
    });
    return out;
  },
  view: function(){
    var d = Gems.load(), days = Gems.mergedDays(d), adj = Q.cleanAdj(Gems.adjMap(d.srv.adj));
    return { data: d, days: days, adj: adj, tiers: d.srv.tiers, sum: Q.summary(days, adj), unsynced: Gems.unsynced(d) };
  },
  adjMap: function(list){ var m = {}; (list || []).forEach(function(a){ m[a.id] = a; }); return m; },
  unsynced: function(d){ return Object.keys(d.days).filter(function(k){ return d.days[k].done && !d.days[k].sync; }).length; },
  /* 서버의 내 기록·교환표를 읽어 합침 (다른 기기에서 끝낸 날도 반영) */
  pull: async function(){
    if(!App.child) return false;
    var r, cfg;
    try{ r = await Fb.readGems(App.child.id); cfg = await Fb.readGemConfig(); }catch(e){ Gems.online = false; return false; }
    var d = Gems.load(), sd = Q.cleanDays(r && r.days);
    d.srv = { days: sd, adj: Q.cleanAdj(r && r.adj), tiers: Q.cleanConfig(cfg).tiers, at: Date.now() };
    Object.keys(sd).forEach(function(date){
      var e = d.days[date] || (d.days[date] = { qs: [], res: {} });
      e.done = true; e.paid = sd[date].paid; e.ok = sd[date].ok; e.n = sd[date].n; e.sync = true;    // 같은 날 두 번 받지 않게 서버 기록을 기준으로 함
    });
    Gems.online = true;
    Gems.save(d);
    await Gems.pushPending();
    return true;
  },
  /* 아직 서버에 없는 '끝낸 날'을 올림 (안 되면 다음에 다시) */
  pushPending: async function(){
    if(!App.child) return false;
    var d = Gems.load(), todo = Object.keys(d.days).filter(function(k){ return d.days[k].done && !d.days[k].sync; }).sort(), allOk = true, i;
    for(i=0;i<todo.length;i++){
      var date = todo[i], e = d.days[date];
      var rec = { n: Q.int(e.n || (e.qs ? e.qs.length : 0), 0, 10), ok: Q.int(e.ok, 0, 10), paid: Q.int(e.paid, 0, Q.MAXPAY), at: Date.now() };
      try{ await Fb.putGemDay(App.child.id, date, rec); }
      catch(err){ allOk = false; Gems.online = false; break; }
      var d2 = Gems.load();
      if(d2.days[date]){ d2.days[date].sync = true; }
      d2.srv.days[date] = { n: rec.n, ok: rec.ok, paid: rec.paid, at: rec.at };
      Gems.save(d2);
      Gems.online = true;
    }
    return allOk;
  }
};

/* ---------- 화면에서 쓰는 준비물 ---------- */
App.qz = null;
function quizCtx(withSound){
  var ctx = { langs: {} };
  ['en', 'zh'].forEach(function(lang){
    var u = usableSection(lang);
    if(u.state !== 'ready') return;
    var sec = u.section;
    ctx.langs[lang] = { sec: sec, canPlay: function(row){
      if(!withSound) return false;
      if(!row || !Q.clean(row.text)) return false;
      if(App.qzBadAudio && App.qzBadAudio[lang]) { /* 오래된 음원은 구간이 어긋날 수 있어 파일 소리는 쓰지 않음 */
        return !!(Core.ttsConfirmed(lang, row) && Tts.usable(lang));
      }
      return !!rowFile(row, sec, lang) || !!(Core.ttsConfirmed(lang, row) && Tts.usable(lang));
    } };
  });
  return ctx;
}
function quizDayEntry(data, today){
  if(!data.days[today]) data.days[today] = { qs: [], res: {}, done: false, paid: 0, ok: 0 };
  var e = data.days[today];
  if(!Array.isArray(e.qs)) e.qs = [];
  if(!e.res || typeof e.res !== 'object') e.res = {};
  return e;
}
/* 오늘의 문제 정하기(없으면 새로 뽑고, 있으면 이어서). 저장까지 함 */
function quizPlanToday(ctx, pool){
  var child = App.child, today = Q.dateStr(), data = Gems.load(), e = quizDayEntry(data, today);
  if(!e.done){
    var byKey = {}; pool.forEach(function(d){ byKey[d.key] = d; });
    e.qs = e.qs.filter(function(k){ return e.res[k] !== undefined || byKey[k]; });    // 풀 수 없게 된 문제만 빼고, 이미 푼 것은 유지
    var need = Q.DAILY - e.qs.length;
    if(need > 0){
      var rest = pool.filter(function(d){ return e.qs.indexOf(d.key) < 0; });
      var fixedDescs = e.qs.map(function(k){ return byKey[k]; }).filter(Boolean);
      var picks = Q.pick(rest, { n: need, seed: (child ? child.id : 'guest') + '|' + today, hist: data.hist, today: today, wrong: data.wrong, allowRetry: e.qs.length === 0, fixedDescs: fixedDescs });
      picks.forEach(function(d){ e.qs.push(d.key); data.hist[d.key] = today; });
    }
    Gems.save(data);
  }
  return { data: data, entry: e, today: today };
}
/* 소리 문제를 위해 필요한 소리 파일 불러오기 (연습실에서 언어를 열 때와 같은 방식) */
async function quizLoadSources(){
  App.qzBadAudio = {};
  var langs = ['en', 'zh'];
  for(var i=0;i<langs.length;i++){
    var lang = langs[i], u = usableSection(lang);
    if(u.state !== 'ready') continue;
    var sec = u.section;
    if(!sec.own){
      var a = await ensureAudio(lang, false);
      if(a && a.status === 'ok' && Core.stampParts(sec.audioStamp).len !== a.len) App.qzBadAudio[lang] = true;
    }
    await loadSectionSources(sec, false);
  }
  await Tts.init();
}
function quizSessionQuestions(ctx, plan){
  var child = App.child;
  return plan.entry.qs.map(function(k){
    // 풀 수 없게 된 문제는 null (이미 푼 기록만 남아 있는 경우)
    return Q.build(Q.parseKey(k), ctx, (child ? child.id : 'guest') + '|' + plan.today);
  });
}

/* ---------- 연습실 홈의 카드 두 장 ---------- */
function quizMenuHtml(){
  if(!App.child) return '';
  if(!Gems._bg){ Gems._bg = true; setTimeout(quizBgPull, 0); }       // 홈이 열리면 서버의 내 기록·교환표를 한 번 확인
  var ctx = quizCtx(false), pool = Q.pool(ctx), gv = Gems.view(), data = gv.data, today = Q.dateStr(), e = data.days[today];
  var ready = pool.length > 0, sub, cls = '';
  if(!ready){ sub = '말씀을 준비하고 있어요'; cls = ' off'; }
  else if(e && e.done){ sub = '오늘 완료 ✅ 💎 +' + (e.paid || 0); cls = ' done'; }
  else {
    var n = e && e.qs && e.qs.length ? e.qs.length : Math.min(Q.DAILY, pool.length), got = e ? Object.keys(e.res || {}).length : 0;
    sub = got ? '이어서 풀어요 ' + got + '/' + n : '오늘 하루 ' + n + '문제 도전!';
  }
  return '<div class="qz-row">' +
    '<button class="qz-card qz-quiz' + cls + '" data-act="quiz-open"><span class="qz-ico">🧩</span><span class="qz-t">말씀 퀴즈</span><span class="qz-s">' + esc(sub) + '</span></button>' +
    '<button class="qz-card qz-gems" data-act="gems-open"><span class="qz-ico">💎</span><span class="qz-t">나의 보석함</span><span class="qz-s">보석 ' + gv.sum.balance + '개</span></button>' +
  '</div>';
}

function quizBgPull(){
  Gems.pull().then(function(){
    if(App.view === 'home'){ var row = document.querySelector('.qz-row'); if(row) row.outerHTML = quizMenuHtml(); }
  });
}

/* ---------- 퀴즈 화면 ---------- */
function quizTop(){
  var c = App.child;
  return '<div class="topbar"><button class="back" data-act="home">← 연습실</button><span class="who">' + (c ? esc(avatarOf(c)) + ' ' + esc(c.name) : '') + '</span></div>';
}
async function openQuiz(){
  if(!App.child){ toast('이름을 고른 뒤에 해요'); return; }
  stopEverything(false);
  App.view = 'quiz'; App.preview = false;
  setWide(false);
  renderLoading('문제를 준비하는 중…');
  // 다른 기기에서 오늘 이미 끝냈는지 서버 기록을 먼저 확인 (4초 안에 안 되면 이 기기 기록으로 진행)
  await Promise.race([Gems.pull(), new Promise(function(r){ setTimeout(r, 4000); })]);
  try{ await quizLoadSources(); }catch(e){ /* 소리를 못 불러와도 글자 문제는 풀 수 있게 */ }
  if(App.view !== 'quiz') return;
  var ctx = quizCtx(true), pool = Q.pool(ctx);
  if(!pool.length){
    $view.innerHTML = quizTop() + '<div class="center-msg" style="padding-top:60px;"><div style="font-size:54px;">🌱</div><h2 class="display">퀴즈를 준비하고 있어요</h2>선생님이 이번 주 말씀을 준비하면<br>퀴즈가 열려요.<br><br><button class="btn leaf" data-act="home">연습실로 가기</button></div>';
    return;
  }
  var plan = quizPlanToday(ctx, pool);
  App.qz = { ctx: ctx, plan: plan, qs: quizSessionQuestions(ctx, plan), picked: null, fresh: false };
  renderQuiz();
}
function quizFirstOpen(){
  var e = App.qz.plan.entry;
  for(var i=0;i<e.qs.length;i++){ if(e.res[e.qs[i]] === undefined && App.qz.qs[i]) return i; }
  return -1;
}
function quizDots(idx){
  var e = App.qz.plan.entry;
  return '<div class="qz-dots">' + e.qs.map(function(k, i){
    var r = e.res[k];
    return '<span class="qz-dot ' + (r === 1 ? 'ok' : r === 0 ? 'no' : '') + (i === idx ? ' cur' : '') + '"></span>';
  }).join('') + '</div>';
}
function qzTextHtml(lang, text, py){
  return lang === 'zh' ? rubyHtml(text, py, App.pinyinOn) : esc(text);
}
function qzOptHtml(q, o, i, state){
  var inner = q.type === 'meaning' ? esc(o.t) : (q.lang === 'zh' ? rubyHtml(o.t, o.py, App.pinyinOn) : esc(o.t));
  var cls = 'qz-opt' + (q.lang === 'zh' && q.type !== 'meaning' ? ' zh' : '');
  if(state){
    if(o.ok) cls += " right"; else if(state.i === i) cls += " wrong";
  }
  return '<button class="' + cls + '" data-act="quiz-pick" data-i="' + i + '" ' + (state ? 'disabled' : '') + '>' + inner + '</button>';
}
function renderQuiz(){
  var Z = App.qz;
  if(!Z){ renderHome(); return; }
  stopSounds();
  var e = Z.plan.entry;
  if(e.done){ renderQuizDone(); return; }
  var idx = Z.picked ? Z.picked.idx : quizFirstOpen();
  if(idx < 0){ finishQuiz(); return; }
  var q = Z.qs[idx], state = Z.picked;
  var lastQ = e.qs.filter(function(k, i){ return i !== idx && e.res[k] === undefined && Z.qs[i]; }).length === 0;
  var head, body = '';
  if(q.type === 'meaning'){
    head = '이 말은 무슨 뜻일까요?';
    body = '<div class="qz-big ' + (q.lang === 'zh' ? 'zh' : '') + '">' + qzTextHtml(q.lang, q.text, q.py) + '</div>' +
      (q.canPlay ? '<button class="pbtn qz-play" data-act="quiz-play" data-pid="q:' + esc(q.key) + '"><span>🔊</span><span class="lab">듣기</span></button>' : '');
  } else if(q.type === 'reverse'){
    head = '이 뜻의 말을 찾아요';
    body = '<div class="qz-big ko">' + esc(q.ko) + '</div>';
  } else if(q.type === 'listen'){
    head = '소리를 듣고 알맞은 말을 골라요';
    body = '<button class="pbtn qz-play big" data-act="quiz-play" data-pid="q:' + esc(q.key) + '"><span>🔊</span><span class="lab">소리 듣기</span></button>';
  } else {
    head = '빈칸에 알맞은 말은?';
    body = '<div class="qz-big sm ' + (q.lang === 'zh' ? 'zh' : '') + '">' + esc(q.before) + '<span class="qz-blank">' + (state ? esc(q.opts.filter(function(o){ return o.ok; })[0].t) : '＿＿＿') + '</span>' + esc(q.after) + '</div>' +
      (q.ko ? '<div class="qz-hint">뜻: ' + esc(q.ko) + '</div>' : '');
  }
  var fb = '';
  if(state){
    var rightOpt = q.opts.filter(function(o){ return o.ok; })[0];
    fb = state.ok
      ? '<div class="qz-fb good">맞았어요! 👏 참 잘했어요!</div>'
      : '<div class="qz-fb soso">괜찮아요! 정답은 <b>' + esc(rightOpt.t) + '</b> 이에요. 내일 한 번 더 만나요 🌱</div>';
  }
  $view.innerHTML = quizTop() +
    '<div class="qz-wrap"><div class="qz-title">🧩 오늘의 말씀 퀴즈 <span class="qz-no">' + (idx + 1) + '/' + e.qs.length + '</span></div>' + quizDots(idx) +
    '<div class="qz-card-q"><div class="qz-flag">' + L10N[q.lang].flag + ' ' + L10N[q.lang].short + '</div><div class="qz-head">' + head + '</div>' + body + '</div>' +
    '<div class="qz-opts">' + q.opts.map(function(o, i){ return qzOptHtml(q, o, i, state); }).join('') + '</div>' +
    fb + (state ? '<button class="btn leaf block big qz-next" data-act="quiz-next">' + (lastQ ? '결과 보기 💎' : '다음 문제 ▶') + '</button>' : '') +
    '</div>';
}
function quizPlay(){
  var Z = App.qz; if(!Z) return;
  var idx = Z.picked ? Z.picked.idx : quizFirstOpen(); if(idx < 0) return;
  var q = Z.qs[idx], L = Z.ctx.langs[q.lang], pid = 'q:' + q.key, row = q.row;
  if(isPlayingAny(pid)){ stopSounds(); return; }
  stopSounds();
  var rf = rowFile(row, L.sec, q.lang), opts = { times: 1, gapMs: 600, rate: 1, followMs: 0 };
  if(rf && !(App.qzBadAudio && App.qzBadAudio[q.lang])){
    if(rf.player === Player) attachAudio(q.lang);
    rf.player.play(pid, rf.start, rf.end, opts);
  } else if(Core.ttsConfirmed(q.lang, row) && Tts.usable(q.lang)){
    Voice.play(pid, Core.speakText(q.lang, row), q.lang, opts);
  } else { toast('소리를 준비하고 있어요.'); }
}
function quizPick(i){
  var Z = App.qz; if(!Z || Z.picked) return;
  var idx = quizFirstOpen(); if(idx < 0) return;
  var q = Z.qs[idx], o = q.opts[i]; if(!o) return;
  stopSounds();
  var data = Gems.load(), e = quizDayEntry(data, Z.plan.today);
  if(e.done) return;
  e.res[q.key] = o.ok ? 1 : 0;
  data.hist[q.key] = Z.plan.today;
  var wi = data.wrong.indexOf(q.key);
  if(o.ok){ if(wi >= 0) data.wrong.splice(wi, 1); }
  else if(wi < 0){ data.wrong.push(q.key); }
  Gems.save(data);
  Z.plan.data = data; Z.plan.entry = e;
  Z.picked = { idx: idx, i: i, ok: !!o.ok };
  renderQuiz();
  var fb = document.querySelector('.qz-fb'); if(fb && fb.scrollIntoView){ try{ fb.scrollIntoView({ block: 'center', behavior: 'smooth' }); }catch(err){} }
}
/* 마지막 문제까지 다 풀었을 때 한 번만 보석 지급 */
function finishQuiz(){
  var Z = App.qz;
  var data = Gems.load(), e = quizDayEntry(data, Z.plan.today);
  if(!e.done){
    var keys = e.qs, okCount = keys.filter(function(k){ return e.res[k] === 1; }).length;
    var pay = Q.reward(keys.length, okCount);
    e.done = true; e.ok = okCount; e.paid = pay; e.n = keys.length; e.sync = false;
    Gems.save(data);
    Z.fresh = true;
    Gems.pushPending().then(function(){ quizSyncNote(); });      // 서버(선생님 화면)에도 기록
  }
  Z.plan.data = data; Z.plan.entry = e; Z.picked = null;
  renderQuizDone();
}
function renderQuizDone(){
  var Z = App.qz, e = Z.plan.entry, n = e.n || (e.qs ? e.qs.length : 0), ok = e.ok || 0, paid = e.paid || 0;
  var bonus = (ok === n && n > 0);
  var gems = ''; for(var i=0;i<paid;i++) gems += '<span class="qz-gem ' + (Z.fresh ? 'pop' : '') + '" style="animation-delay:' + (i * 0.25) + 's">💎</span>';
  var msg = bonus ? '모두 맞혔어요! 보너스 보석도 받았어요 ✨' : ok > 0 ? n + '문제 중 ' + ok + '개 맞았어요. 끝까지 해서 참 멋져요!' : '끝까지 해냈어요! 내일은 더 잘할 수 있어요 🌱';
  $view.innerHTML = quizTop() +
    '<div class="qz-wrap"><div class="qz-done"><div class="qz-done-t">' + (Z.fresh ? '🎉 오늘 퀴즈 끝!' : '✅ 오늘 퀴즈를 마쳤어요') + '</div>' +
    '<div class="qz-gem-row">' + gems + '</div>' +
    '<div class="qz-done-p">' + (paid ? '보석 ' + paid + '개를 받았어요!' : '') + '</div>' +
    '<div class="qz-done-m">' + esc(msg) + '</div>' + quizDots(-1) +
    '<div class="qz-done-btns"><button class="btn gold block big" data-act="gems-open">💎 보석함 보러 가기</button><button class="btn ghost block" data-act="home">← 연습실로</button></div>' +
    '<p class="help" style="text-align:center;margin-top:12px;">내일 또 새로운 문제로 만나요! 보석은 하루에 최대 ' + Q.MAXPAY + '개까지 받을 수 있어요.</p>' +
    '<p class="help qz-sync" id="qzSync" style="text-align:center;margin:4px 0 0;"></p></div></div>';
  Z.fresh = false;
  quizSyncNote();
}
function quizSyncNote(){
  var el = document.getElementById('qzSync'); if(!el) return;
  var n = Gems.unsynced(Gems.load());
  el.textContent = n === 0 ? '☁ 선생님도 볼 수 있게 기록됐어요' : '📱 이 기기에 저장했어요. 인터넷이 되면 선생님께 전달돼요';
}

/* ---------- 나의 보석함 ---------- */
function openGems(skipPull){
  stopEverything(false);
  App.view = 'gems'; App.preview = false; App.qz = null;
  setWide(false);
  renderGems();
  if(!skipPull){ Gems.pull().then(function(){ if(App.view === 'gems') renderGems(); }); }     // 보석함을 연 뒤 서버 기록으로 새로 고침
}
function renderGems(){
  var v = Gems.view(), sum = v.sum, today = Q.dateStr(), te = v.days[today], bal = sum.balance;
  var shelf = '', show = Math.min(bal, 120), i;
  for(i=0;i<show;i++) shelf += '<span class="gm-gem" style="filter:hue-rotate(' + ((i * 47) % 360) + 'deg)">💎</span>';
  if(bal > show) shelf += '<span class="gm-more">… 그리고 ' + (bal - show) + '개 더</span>';
  // 다음 보상 안내 (교환표는 선생님이 정함)
  var rs = Q.rewardStatus(bal, v.tiers), reward = '';
  if(v.tiers.length){
    if(rs.can.length) reward += '<div class="gm-can">🎁 교환할 수 있어요! 선생님께 말해 주세요<br><span>(' + rs.can.map(function(t){ return esc(t.name) + ' ' + t.n + '개'; }).join(' · ') + ')</span></div>';
    if(rs.next){
      var pct = Math.max(4, Math.min(100, Math.round(bal / rs.next.n * 100)));
      reward += '<div class="gm-next">다음 보상 <b>' + esc(rs.next.name) + '</b> 까지 <b>' + (rs.next.n - bal) + '개</b> 남았어요!<div class="gm-bar"><i style="width:' + pct + '%"></i></div></div>';
    }
    reward += '<div class="gm-tiers">' + v.tiers.map(function(t){ return '<span class="gm-tier ' + (t.n <= bal ? 'on' : '') + '">' + t.n + '개 · ' + esc(t.name) + '</span>'; }).join('') + '</div>';
  }
  var ex = v.adj.slice().reverse().map(function(a){
    var label = a.k === 'x' ? '🎁 ' + esc(a.reward || '보상 교환') : '✨ ' + esc(a.memo || '선생님 조정');
    var sub = (a.k === 'x' && a.memo) ? '<span class="gm-sub">' + esc(a.memo) + '</span>' : '';
    return '<div class="gm-log ' + (a.off ? 'off' : '') + '"><span class="gm-d">' + Q.mdLabel(a.at) + '</span><span>' + label + sub + (a.off ? ' <i>(취소됨)</i>' : '') + '</span><span class="gm-p">' + (a.d > 0 ? '+' : '') + a.d + '개</span></div>';
  }).join('');
  var days = Object.keys(v.days).filter(function(d){ return v.days[d].n > 0; }).sort().reverse().slice(0, 14);
  var log = days.map(function(d){
    var e = v.days[d];
    return '<div class="gm-log"><span class="gm-d">' + (parseInt(d.slice(5, 7), 10)) + '/' + (parseInt(d.slice(8, 10), 10)) + '</span><span>🧩 ' + (e.ok || 0) + '/' + (e.n || 0) + ' 맞힘</span><span class="gm-p">💎 ' + (e.paid || 0) + '</span></div>';
  }).join('');
  var note;
  if(v.unsynced > 0) note = '📱 아직 선생님께 전달되지 않은 기록이 ' + v.unsynced + '일치 있어요. 인터넷이 되면 자동으로 전달돼요.';
  else if(Gems.online === false) note = '📡 인터넷이 연결되지 않아 마지막으로 확인한 기록이에요.';
  else note = '☁ 선생님과 함께 보는 기록이에요. 같은 이름으로 들어오면 다른 폰에서도 보여요.';
  $view.innerHTML = quizTop() +
    '<div class="gm-hero"><div class="gm-title display">💎 나의 보석함</div><div class="gm-total">남은 보석 <b>' + bal + '</b>개</div>' +
    '<div class="gm-today">받은 보석 모두 ' + sum.earned + '개' + (sum.exchanged ? ' · 교환 ' + sum.exchanged + '개' : '') + '</div>' +
    (te && te.n > 0 ? '<div class="gm-today">오늘 받은 보석 💎 ' + (te.paid || 0) + '개</div>' : '<div class="gm-today">오늘 퀴즈를 풀면 보석을 받아요!</div>') + '</div>' +
    reward +
    '<div class="gm-shelf">' + (shelf || '<div class="gm-empty">' + (sum.earned ? '보석을 모두 교환했어요! 🎉<br>또 모아 볼까요?' : '🧩 말씀 퀴즈를 풀면 보석이 모여요.<br>첫 보석을 모아 볼까요?') + '</div>') + '</div>' +
    (ex ? '<h3 class="gm-h">교환 · 선물 기록</h3><div class="gm-logs">' + ex + '</div>' : '') +
    (log ? '<h3 class="gm-h">지난 퀴즈 기록</h3><div class="gm-logs">' + log + '</div>' : '') +
    '<div style="margin-top:14px;"><button class="btn leaf block big" data-act="quiz-open">🧩 말씀 퀴즈 하러 가기</button></div>' +
    '<p class="help" style="text-align:center;margin-top:12px;">' + note + (Gems.stored ? '' : '<br><b>⚠ 이 기기에는 저장이 안 되지만, 인터넷이 되면 서버에는 기록돼요.</b>') + '</p>';
}

/* ============================================================
   선생님 화면: 💎 보석 현황 · 교환 기록 · 교환표  (선생님 PIN을 넣은 뒤에만 열림)
   - 아이 화면은 days 기록만 쓰고, 교환·조정(adj)과 교환표(gemsConfig)는 여기서만 씀
   ============================================================ */
App.gadm = { all: null, cfg: null, draft: null, sel: null, err: false, busy: false };
function gadmChildren(){ return ((App.appState || {}).children) || []; }
function gadmData(cid){
  var raw = ((App.gadm.all || {})[cid]) || {}, days = Q.cleanDays(raw.days), adj = Q.cleanAdj(raw.adj);
  return { raw: raw, days: days, adj: adj, sum: Q.summary(days, adj) };
}
async function gadmLoad(){
  App.gadm.err = false;
  try{
    var r = await Promise.all([Fb.readAllGems(), Fb.readGemConfig()]);
    App.gadm.all = (r[0] && typeof r[0] === 'object') ? r[0] : {};
    App.gadm.cfg = Q.cleanConfig(r[1]);
    App.gadm.draft = App.gadm.cfg.tiers.map(function(t){ return { n: t.n, name: t.name }; });
  }catch(e){ App.gadm.err = true; }
}
async function openGemsAdmin(){
  if(!App.adminOk){ openPin(); return; }
  stopEverything(false);
  App.view = 'admin-gems'; App.preview = false;
  setWide(true);
  renderLoading('보석 기록을 불러오는 중…');
  await gadmLoad();
  if(App.view !== 'admin-gems') return;
  renderGemsAdmin();
}
function gadmTop(){ return '<div class="topbar"><button class="back" data-act="adm-back">← 관리 화면으로</button><span class="who">👩‍🏫 선생님</span></div>'; }
function renderGemsAdmin(){
  var G = App.gadm;
  if(G.err){
    $view.innerHTML = '<div class="adm">' + gadmTop() + '<div class="adm-card"><h2>💎 보석 현황</h2><p class="help">보석 기록을 불러오지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.</p><div class="actions"><button class="btn leaf" data-act="gadm-reload">다시 불러오기</button></div></div></div>';
    return;
  }
  var today = Q.dateStr(), kids = gadmChildren();

/* ============================================================
   📖 지난 말씀 보관함  (연습실 안에서만 쓰는 기능)
   - 선생님이 말씀을 "게시"할 때마다 그 말씀을 자동으로 보관함에 한 부 더 저장해요.
     (같은 말씀을 다시 게시하면 새 칸이 생기지 않고 같은 칸이 최신 내용으로 바뀜)
   - 전체 음원을 쓰는 말씀은, 다음 음원이 올라와도 소리가 사라지지 않게 그 음원의 사본을 함께 보관해요.
   - 아이들은 보관함에서 보고·듣고·따라 하기만 해요. 퀴즈·보석·말씀정원과는 무관해요.
   - 쓰는 곳: studyRoom/archive/<en|zh>/<id> (내용), studyRoom/archiveIdx/<en|zh>/<id> (목록용 짧은 정보)
   ============================================================ */
var Arch = { idx: null, busy: false, autoDone: false, note: '' };
Core.Arch = Arch;

/* 같은 언어·같은 말씀 글자면 같은 id (대소문자·띄어쓰기 차이는 무시) */
Arch.idOf = function(lang, sec){
  var h = Core.Q.hash(lang + '|' + Core.normText(sec.text)).toString(36);
  return 'v' + ('0000000' + h).slice(-7);
};
Arch.okSection = function(sec){
  return !!sec && typeof sec === 'object' && typeof sec.text === 'string' && sec.text.length > 0 &&
    Array.isArray(sec.words) && Array.isArray(sec.phrases) && sec.full && typeof sec.full === 'object';
};
Arch.usesMain = function(sec){
  return (sec.words || []).concat(sec.phrases || [], [sec.full]).some(function(r){ return Core.rowFileKind(sec, r) === 'main'; });
};
/* 목록용 짧은 정보 */
Arch.idxOf = function(lang, sec, entry){
  var vc = verseCard(), same = Core.normText(vc[lang] || '') === Core.normText(sec.text);
  var o = { ref: String(sec.verseRef || (same ? vc.ref : '') || '').slice(0, 60), at: +sec.publishedAt || Date.now(),
    snip: String(sec.text).slice(0, 60), sound: !!(entry.own || !Arch.usesMain(entry)) };
  if(sec.versionName) o.ver = String(sec.versionName).slice(0, 30);
  if(same && vc.ko) o.ko = String(vc.ko).slice(0, 120);
  return o;
};
/* 지금 등록된 전체 음원의 사본을 서버(studyRoom/clips/<새 id>)에 저장해 소리 파일 정보를 돌려줌. 못 하면 null */
Arch.freezeAudio = async function(lang, sec){
  var a = await ensureAudio(lang, true);
  if(!a || a.status !== 'ok' || !a.blob) return null;
  var sp = Core.stampParts(sec.audioStamp);
  if(sp.at !== curAudioAt(lang) || sp.len !== a.len) return null;          // 지금 음원이 이 말씀의 음원이 아니면 복사하지 않음
  var du = await Core.blobToDataUrl(a.blob);
  if(du.length > 6 * 1024 * 1024) return null;
  var pr = await Core.probeAudio(a.blob, false);
  if(!(pr && pr.dur > 0.2)) return null;
  var id = Core.newClipId();
  await Fb.putClip(id, du);
  var back = null;
  try{ back = await Fb.readClip(id); }catch(e){}
  if(!back || back.length !== du.length){ try{ await Fb.putClip(id, ''); }catch(e){} return null; }
  return { id: id, name: '등록 음원 사본', mime: (a.blob.type || 'audio/mpeg'), len: du.length, dur: Core.r2(pr.dur), forText: Core.normText(sec.text) };
};
/* 말씀 한 부를 보관함에 저장. 결과: 'saved' | 'kept'(이미 더 좋은 보관본이 있어 그대로 둠) */
Arch.save = async function(lang, sec){
  if(!Arch.okSection(sec)) throw new Error('보관할 말씀이 올바르지 않아요');
  var id = Arch.idOf(lang, sec), entry = clone(sec), prev = null;
  try{ prev = await Fb.readArchive(lang, id); }catch(e){ throw new Error('보관함을 읽지 못했어요'); }
  entry.arch = { at: Date.now() };
  if(!entry.own && Arch.usesMain(entry)){
    var reuse = prev && prev.arch && prev.arch.srcStamp === sec.audioStamp ? Core.cleanMeta(prev.own) : null;
    var meta = reuse || await Arch.freezeAudio(lang, entry).catch(function(){ return null; });
    if(meta){ entry.arch.srcStamp = sec.audioStamp; entry.own = meta; entry.audioStamp = 'own:' + meta.id; }
    else {
      /* 소리 사본을 못 만든 경우: 이미 소리가 있는 보관본이 있으면 그걸 지키고, 없으면 글자만이라도 보관 */
      if(prev && (prev.own || !Arch.usesMain(prev))) return 'kept';
      entry.arch.noMain = true;
    }
  }
  await Fb.putArchive(lang, id, entry);
  await Fb.putArchiveIdx(lang, id, Arch.idxOf(lang, sec, entry));
  Arch.idx = null;
  return 'saved';
};
Arch.loadIdx = async function(){
  var raw = await Fb.readArchiveIdx(), out = [];
  ['en', 'zh'].forEach(function(lang){
    var g = (raw && raw[lang]) || {};
    Object.keys(g).forEach(function(id){
      var v = g[id];
      if(!v || typeof v !== 'object' || !/^[A-Za-z0-9_-]{6,40}$/.test(id)) return;
      out.push({ lang: lang, id: id, ref: String(v.ref || '').slice(0, 60), at: +v.at || 0, snip: String(v.snip || '').slice(0, 60),
        ko: String(v.ko || '').slice(0, 120), ver: String(v.ver || '').slice(0, 30), sound: v.sound !== false });
    });
  });
  out.sort(function(a, b){ return b.at - a.at; });
  return (Arch.idx = out);
};
Arch.dateText = function(at){
  if(!(at > 0)) return '';
  var d = new Date(at); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
};

/* 지금 게시된 말씀(영어·중국어)을 보관함에 넣음. quiet=true 면 이미 있는 말씀은 건드리지 않음 */
Arch.saveCurrent = async function(quiet){
  if(Arch.busy) return;
  Arch.busy = true;
  var done = 0, kept = 0, fail = 0, had = 0;
  try{
    try{ await Arch.loadIdx(); }catch(e){ Arch.note = '보관함을 불러오지 못했어요. 인터넷을 확인해 주세요.'; return; }
    await refreshAppState();
    var langs = ['en', 'zh'];
    for(var i=0;i<langs.length;i++){
      var lang = langs[i], doc = App.docs[lang], pub = doc && doc.published;
      if(!pub || !Arch.okSection(pub)) continue;
      var id = Arch.idOf(lang, pub), exists = (Arch.idx || []).some(function(x){ return x.lang === lang && x.id === id; });
      if(quiet && exists){ had++; continue; }
      try{ var r = await Arch.save(lang, pub); if(r === 'saved') done++; else kept++; }
      catch(e){ fail++; }
    }
    try{ await Arch.loadIdx(); }catch(e){}
    Arch.note = fail ? ('일부는 저장하지 못했어요(' + fail + '개). 잠시 뒤 [지금 게시된 말씀 보관하기]를 다시 눌러 주세요.')
      : done ? ('✔ 지금 게시된 말씀 ' + done + '개를 보관했어요.')
      : (kept || had) ? '지금 게시된 말씀은 이미 보관돼 있어요.' : '지금 게시된 말씀이 없어요.';
  } finally { Arch.busy = false; archAdminRefresh(); }
};
function archAdminOpened(){
  if(!Arch.idx){ Arch.loadIdx().then(archAdminRefresh, function(){ Arch.note = '보관함을 불러오지 못했어요.'; archAdminRefresh(); }); }
  if(!Arch.autoDone){ Arch.autoDone = true; Arch.saveCurrent(true); }
}

}

function curVerse(lang){ return verseCard()[lang] || ''; }
function curAudioAt(lang){ return ((((App.appState || {}).settings || {}).verseAudio || {})[lang] || {}).uploadedAt || ''; }
/* 선생님이 골라 둔 연습실 전용 음원(없으면 null) */
function ownMeta(lang){ return Core.cleanMeta((App.docs[lang] || {}).ownAudio); }
/* 전용 음원을 올릴 때의 말씀과 지금 등록된 말씀이 다르면(= 지난 말씀용 음원) true */
function ownStale(lang){
  var o = ownMeta(lang);
  return !!(o && o.forText && o.forText !== Core.normText(curVerse(lang)));
}
function chosenSrcKey(lang){ var o = ownMeta(lang); return o ? 'own:' + o.id : 'main:' + curAudioAt(lang); }
function secSrcKey(sec){ return sec.own ? 'own:' + sec.own.id : 'main:' + Core.stampParts(sec.audioStamp).at; }
/* isDraft: 초안은 "지금 고른 음원"과 같은 음원으로 만들어졌는지도 봄. 게시본은 아이들이 보는 기준(전용 음원이면 설정 화면 음원이 바뀌어도 그대로) */
function sectionStale(sec, lang, isDraft){
  if(!sec) return false;
  if(Core.normText(sec.text) !== Core.normText(curVerse(lang))) return true;
  if(isDraft) return secSrcKey(sec) !== chosenSrcKey(lang);
  return sec.own ? false : Core.stampParts(sec.audioStamp).at !== curAudioAt(lang);
}
function badgesFor(lang){
  var doc = App.docs[lang] || {}, w = Adm.work[lang], b = [];
  if(doc.published){
    b.push('<span class="badge pub">게시됨 · ' + dateLabel(doc.published.publishedAt) + '</span>');
    if(sectionStale(doc.published, lang)) b.push('<span class="badge warn">⚠ 말씀/음원이 바뀌어 아이들에게는 "준비 중"으로 보여요</span>');
  } else b.push('<span class="badge">게시 안 됨</span>');
  if(w){
    b.push('<span class="badge draft">초안 있음' + (w.updatedAt ? ' · ' + dateLabel(w.updatedAt) : '') + '</span>');
    if(sectionStale(w, lang, true)) b.push('<span class="badge warn">⚠ 이 초안은 지금 말씀/음원과 달라요 → 다시 자동 생성</span>');
  }
  if(Adm.dirty[lang]) b.push('<span class="dirty">● 저장 안 된 수정이 있어요</span>');
  return b.join(' ');
}

function onSecField(el){

  var lang = card.getAttribute('data-lang'), w = Adm.work[lang]; if(!w) return;

  else if(f === 'credit'){ w.credit = el.value; }

    if(!Core.speakText(ctx.lang, ctx.m)){ el.checked = false; toast('글자가 비어 있어요'); return; }
    if(!Adm.ttsPlayed[(ctx.m.id || '') + '|' + sig]){ el.checked = false; toast('먼저 [▶ 기기 음성 미리듣기]를 눌러 끝까지 들어 보세요'); return; }

function onAdmInput(ev){
  var el = ev.target;
  if(!el.getAttribute) return;
  if(el.getAttribute('data-sf')){ onSecField(el); return; }
  if(!el.getAttribute('data-f')) return;
  var ctx = admModel(el); if(!ctx || !ctx.m) return;
  var f = el.getAttribute('data-f');
  if(f === 'ttsok'){ onTtsOk(el, ctx); return; }
  if(f === 'audio') ctx.m.audio = el.checked;
  else if(f === 'start' || f === 'end' || f === 'wstart' || f === 'wend'){ var v = parseFloat(el.value); ctx.m[f] = isNaN(v) ? 0 : Core.r2(v); }
  else if(f === 'src'){
    if(el.value) ctx.m.src = el.value; else delete ctx.m.src;
    delete Adm.played[ctx.m.id];            // 소리 출처가 바뀌었으니 다시 들어 봐야 함
    markDirty(ctx.lang); rerenderLang(ctx.lang); return;
  }
  else ctx.m[f] = el.value;
  if(f === 'start' || f === 'end' || f === 'wstart' || f === 'wend') delete Adm.played[ctx.m.id];
  // 글자나 읽을 글자를 고치면 그 줄의 기기 음성 확인은 풀림 (다시 들어 보고 확인해야 함)
  if((f === 'text' || f === 'say') && ctx.m.ttsConf && ctx.m.ttsConf !== Core.ttsSig(ctx.lang, ctx.m)) ctx.m.ttsConf = '';

function sanitizeSection(sec){
  var out = clone(sec);
  out.own = Core.cleanMeta(out.own); if(!out.own) delete out.own;
  out.wordsAudio = Core.cleanMeta(out.wordsAudio); if(!out.wordsAudio) delete out.wordsAudio;
  if(out.own) out.audioStamp = 'own:' + out.own.id;
  function fix(r, kind){
    r.text = String(r.text || '').trim(); r.ko = String(r.ko || '').trim(); r.pinyin = String(r.pinyin || '').trim();
    r.start = Core.r2(+r.start || 0); r.end = Core.r2(+r.end || 0);
    // 소리 파일 정보: 줄별 파일 · 단어 낭독 파일 구간
    var clip = Core.cleanMeta(r.clip); if(clip) r.clip = clip; else delete r.clip;
    ['wstart', 'wend'].forEach(function(k){ if(typeof r[k] === 'number' && isFinite(r[k])) r[k] = Core.r2(r[k]); else delete r[k]; });
    var badSrc = (r.src === 'clip' && !r.clip) || (r.src === 'words' && !(kind === 'word' && out.wordsAudio));
    if(badSrc) delete r.src;
    if(r.src !== 'clip' && r.src !== 'words') delete r.src;
    if(badSrc) r.audio = false;      // 가리키던 파일이 없으니, 다른 구간이 저절로 켜지지 않게 소리는 끔
    if(r.audio && !Core.rowFileKind(out, r)) r.audio = false;
    // 기기 음성: 읽을 글자는 중국어만, 확인 표시는 "지금 글자/읽을 글자"와 맞을 때만 유지
    r.say = (out.lang === 'zh') ? String(r.say || '').trim() : '';
    if(!r.say) delete r.say;
    if(r.ttsConf && r.ttsConf !== Core.ttsSig(out.lang, r)) delete r.ttsConf;
    if(!r.ttsConf) delete r.ttsConf;
    return r;
  }
  out.words = (out.words || []).map(function(r){ return fix(r, 'word'); }).filter(function(r){ return r.text; });
  out.phrases = (out.phrases || []).map(function(r){ return fix(r, 'phrase'); }).filter(function(r){ return r.text; });
  out.full.start = Core.r2(+out.full.start || 0); out.full.end = Core.r2(+out.full.end || 0);
  out.versionName = String(out.versionName || '').trim().slice(0, 60);
  out.credit = String(out.credit || '').trim().slice(0, 600);
  if(!out.versionName) delete out.versionName;
  if(!out.credit) delete out.credit;
  return out;
}

function decodeDurationFallback(blob){
  return new Promise(function(res){
    var a = new Audio(); a.preload = 'metadata';

    a.src = URL.createObjectURL(blob);

}

/* ---------- 소리 파일 올리기 (전용 음원 · 단어 낭독 파일 · 줄별 소리) ---------- */
function pickAudioFile(cb){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*,.mp3,.m4a,.wav,.ogg,.webm,.aac'; inp.style.display = 'none';
  inp.onchange = function(){ var f = inp.files && inp.files[0]; if(inp.parentNode) inp.parentNode.removeChild(inp); if(f) cb(f); };
  document.body.appendChild(inp); inp.click();
}
/* 파일을 검사하고 서버(studyRoom/clips/<id>)에 저장한 뒤, 서버에서 다시 읽어 같은지 확인 */
async function admStoreClip(file, kind){
  var mime = Core.audioMime(file);
  if(!mime) throw new Error('소리 파일(MP3, M4A, WAV 등)만 올릴 수 있어요.');
  var limit = Core.CLIP_LIMITS[kind];
  if(file.size > limit) throw new Error('파일이 너무 커요(' + (Math.round(file.size / 1024 / 102.4) / 10) + 'MB). ' + (Math.round(limit / 1024 / 102.4) / 10) + 'MB 이하로 줄여서 올려 주세요. MP3로 바꾸면 훨씬 작아져요.');
  var blob = new Blob([file], { type: mime }), pr;
  try{ pr = await Core.probeAudio(blob, kind === 'words'); }
  catch(e){ throw new Error('이 파일을 읽을 수 없어요. MP3나 M4A로 바꿔서 다시 올려 주세요.'); }
  if(!(pr.dur > 0.2)) throw new Error('소리 길이를 확인하지 못했어요. 다른 파일로 올려 주세요.');
  if(pr.dur > Core.CLIP_MAXSEC[kind]) throw new Error('소리가 너무 길어요(' + Math.round(pr.dur) + '초). ' + Core.CLIP_MAXSEC[kind] + '초 이하로 올려 주세요.');
  var du = await Core.blobToDataUrl(blob), id = Core.newClipId();
  try{ await Fb.putClip(id, du); }catch(e){ throw new Error('서버에 올리지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.'); }
  var back = null;
  try{ back = await Fb.readClip(id); }catch(e){}
  if(!back || back.length !== du.length){
    try{ await Fb.putClip(id, ''); }catch(e){}      // 잘못 저장된 파일은 비워 둠(어디에서도 쓰지 않음)
    throw new Error('서버에 저장된 파일이 올린 파일과 달라요. 다시 올려 주세요.');
  }
  registerClip(id, blob, du.length);      // 이 기기에서 바로 미리듣기 할 수 있게 보관
  return { meta: { id: id, name: String(file.name || '').slice(0, 80), mime: mime, len: du.length, dur: Core.r2(pr.dur) }, E: pr.E };
}

/* 단어 낭독 파일의 쉬는 곳을 기준으로 단어 줄에 구간 붙이기 */
function admApplyWordsSplit(lang, w, E){
  var n = w.words.length, nm = lang === 'zh' ? '표현' : '단어';
  if(!n){ return '핵심 ' + nm + ' 줄이 하나도 없어요. 줄을 추가한 뒤 [✂ 다시 자르기]를 눌러 주세요.'; }
  var sp = Core.splitWordsFile(E, n);
  if(!sp.ok){
    return '낭독 파일에서 쉬는 곳을 기준으로 자르면 ' + sp.found + '조각이 나와요(핵심 ' + nm + ' 줄은 ' + n + '개). 줄에는 붙이지 않았어요. ' +
      '단어마다 한 번씩, 사이를 더 길게(1초 이상) 쉬며 다시 녹음하거나, 줄마다 [출처]를 "낭독 파일 구간"으로 두고 시작/끝을 직접 넣어 주세요.';
  }
  w.words.forEach(function(row, i){
    row.src = 'words'; row.wstart = sp.segs[i].s; row.wend = sp.segs[i].e; row.audio = true;
    delete Adm.played[row.id];
  });
  return '✔ ' + n + '조각으로 잘라 각 줄에 붙였어요. 줄마다 [▶ 미리듣기]로 순서와 잘림을 꼭 확인해 주세요.';

    }
    case 'adm-addphrase': ctx = admModel(el); if(ctx && ctx.w){ ctx.w.phrases.push({ id: Core.uid(), text: '', pinyin: '', ko: '', start: 0, end: 0, audio: false }); markDirty(ctx.lang); rerenderLang(ctx.lang); } return true;
    case 'adm-del': case 'adm-up': case 'adm-down': {
      ctx = admModel(el); if(!ctx || !ctx.m || ctx.kind === 'full') return true;
      var arr = ctx.kind === 'word' ? ctx.w.words : ctx.w.phrases, i = ctx.idx;
      if(act === 'adm-del'){ arr.splice(i, 1); }
      else if(act === 'adm-up' && i > 0){ var t = arr[i-1]; arr[i-1] = arr[i]; arr[i] = t; }
      else if(act === 'adm-down' && i < arr.length - 1){ var t2 = arr[i+1]; arr[i+1] = arr[i]; arr[i] = t2; }
      markDirty(ctx.lang); rerenderLang(ctx.lang);
      return true;
    }
    case 'adm-now': {
      ctx = admModel(el); if(!ctx || !ctx.m) return true;
      var viaWords = ctx.m.src === 'words';
      var au = document.getElementById((viaWords ? 'adm-waudio-' : 'adm-audio-') + ctx.lang);
      if(!au){ toast('음원이 아직 안 불러와졌어요'); return true; }
      var which = el.getAttribute('data-which'), t3 = Core.r2(au.currentTime || 0), fld = viaWords ? 'w' + which : which;
      ctx.m[fld] = t3;
      var inp = ctx.rowEl.querySelector('input[data-f="' + fld + '"]'); if(inp) inp.value = t3;
      delete Adm.played[ctx.m.id]; ctx.rowEl.classList.remove('played');
      markDirty(ctx.lang);
      return true;
    }
    case 'adm-play': {
      ctx = admModel(el); if(!ctx || !ctx.m) return true;
      var pid = el.getAttribute('data-pid');
      if(isPlayingAny(pid)){ stopSounds(); return true; }
      var rf = rowFile(ctx.m, ctx.w, ctx.lang);
      if(!rf){
        var kd = Core.rowFileKind(ctx.w, ctx.m);
        toast(ctx.m.src === 'clip' && !ctx.m.clip ? '이 줄에 올린 소리 파일이 없어요' :
              (!kd && ctx.m.audio === false) ? '"소리 사용"이 꺼져 있어요. 켜면 미리듣기 할 수 있어요' :
              !kd ? '시작/끝 시간을 확인해 주세요 (끝이 시작보다 커야 해요)' :
              '소리 파일을 아직 불러오는 중이거나 불러오지 못했어요. 잠시 뒤 다시 눌러 보세요');
        return true;
      }
      ['adm-audio-', 'adm-waudio-'].forEach(function(pre){ var v = document.getElementById(pre + ctx.lang); if(v) v.pause(); });
      stopSounds();
      if(rf.player === Player) attachAudio(ctx.lang);
      if(ctx.m.id){ Adm.played[ctx.m.id] = true; ctx.rowEl.classList.add('played'); }
      rf.player.play(pid, rf.start, rf.end, { times: 1, rate: 1 });
      return true;
    }
    case 'adm-tts': {
      ctx = admModel(el); if(!ctx || !ctx.m || ctx.kind === 'full') return true;
      var tpid = el.getAttribute('data-pid');
      if(Voice.isPlaying(tpid)){ stopSounds(); return true; }
      var ttxt = Core.speakText(ctx.lang, ctx.m);
      if(!ttxt){ toast('글자가 비어 있어요'); return true; }
      var tst = Tts.state(ctx.lang);
      if(tst === 'unsupported' || tst === 'novoice'){ toast(Tts.reasonText(ctx.lang) + ' 다른 기기나 브라우저에서 확인해 주세요.'); return true; }
      ['adm-audio-', 'adm-waudio-'].forEach(function(pre){ var v3 = document.getElementById(pre + ctx.lang); if(v3) v3.pause(); });
      stopSounds();
      Voice.play(tpid, ttxt, ctx.lang, { times: 1, rate: 1 });   // 끝까지 정상 재생되면 admTtsPassed()가 "들어 봤음"으로 기록
      return true;
    }
    case 'adm-save': {
      ctx = admModel(el); if(!ctx || !ctx.w) return true;
      (async function(){
        try{
          ctx.w.updatedAt = Date.now();
          await saveDoc(ctx.lang, function(doc){ doc.draft = sanitizeSection(ctx.w); });
          Adm.dirty[ctx.lang] = false; toast('임시저장했어요 (아이들에게는 아직 안 보여요)');
          var b = document.getElementById('adm-badges-' + ctx.lang); if(b) b.innerHTML = badgesFor(ctx.lang);
        }catch(e){ toast(String(e.message || e)); }
      })();
      return true;
    }
    case 'adm-preview': {
      ctx = admModel(el); if(!ctx || !ctx.w) return true;
      var copy = sanitizeSection(ctx.w);
      setWide(false);
      openLang(ctx.lang, copy, { preview: true });
      return true;
    }
    case 'adm-publish': publishLang(el); return true;
    case 'adm-unpublish': {
      ctx = admModel(el); if(!ctx) return true;
      if(!window.confirm('게시를 내리면 아이들에게 "준비 중"으로 보여요. 계속할까요?')) return true;
      (async function(){
        try{ await saveDoc(ctx.lang, function(doc){ doc.published = null; }); toast('게시를 내렸어요'); rerenderLang(ctx.lang); }
        catch(e){ toast(String(e.message || e)); }
      })();
      return true;
    }
    case 'adm-copyreq': {
      var info = { ref: verseCard().ref, ko: verseCard().ko, en: verseCard().en, zh: verseCard().zh, sections: { en: Adm.work.en, zh: Adm.work.zh } };
      if(!info.sections.en && !info.sections.zh){ toast('먼저 [연습실 자동 생성]을 눌러 주세요'); return true; }
      var txt = Core.buildClaudeRequest(info); Adm.requestText = txt;
      var ta = document.getElementById('admReqText'); if(ta){ ta.value = txt; ta.rows = 8; }
      var done = function(){ toast('복사했어요! Claude 대화창에 붙여넣어 보내세요'); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ if(ta){ ta.select(); } toast('아래 칸을 길게 눌러 직접 복사해 주세요'); }); }
      else { if(ta){ ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('아래 칸을 직접 복사해 주세요'); } } }
      return true;
    }
    case 'adm-applyjson': {
      var raw = document.getElementById('admJson').value, json;
      try{ json = Core.parseJsonLoose(raw); }catch(e){ toast('붙여넣은 내용을 읽지 못했어요. JSON 부분만 붙여넣어 주세요.'); return true; }
      var lines = [], any = false;
      ['en', 'zh'].forEach(function(lang){
        var w = Adm.work[lang];
        if(!w || !(json[lang])) return;
        var rep = Core.applyMeanings(w, json); any = true;
        lines.push(L10N[lang].short + ': 단어 ' + rep.wordsSet + '개, 구절 뜻 ' + rep.phrasesSet + '개 적용' +
          (rep.missingPhrases.length ? ' · 뜻을 못 찾은 구절 ' + rep.missingPhrases.length + '개' : '') +
          (rep.unknownPhrases.length ? ' · 어느 구절인지 모르는 항목 ' + rep.unknownPhrases.length + '개' : ''));
        markDirty(lang); rerenderLang(lang);
      });
      var r = document.getElementById('admReport');
      if(r) r.innerHTML = any ? esc(lines.join('  /  ')) + '<br>※ 구절 글자가 JSON의 글자와 한 글자라도 다르면 뜻이 들어가지 않아요. 그런 곳은 직접 적어 주세요.' : '적용할 초안이 없어요. 먼저 [연습실 자동 생성]을 눌러 주세요.';
      return true;
    }
  }
  return false;
}
async function publishLang(el){
  var ctx = admModel(el); if(!ctx || !ctx.w) return;
  var lang = ctx.lang, sec = sanitizeSection(ctx.w), L = L10N[lang];
  if(!sec.phrases.length){ toast('구절이 하나도 없어요'); return; }
  await refreshAppState();
  if(secSrcKey(sec) !== chosenSrcKey(lang)){
    toast('고른 음원이 달라졌어요. [자동 생성]을 다시 눌러 주세요.'); return;
  }
  if(!sec.own){
    var a = await ensureAudio(lang, true);   // 게시 직전에 서버의 음원을 다시 확인
    if(a.status !== 'ok'){ toast('음원을 확인하지 못했어요. 잠시 후 다시 해 주세요.'); return; }
    if(Core.stampParts(sec.audioStamp).len !== a.len || Core.stampParts(sec.audioStamp).at !== curAudioAt(lang)){
      toast('음원이 바뀌었어요. [자동 생성]을 다시 눌러 주세요.'); return;
    }
  }
  /* 올려 둔 소리 파일(전용 음원 · 낭독 파일 · 줄별 소리)이 서버에 실제로 있는지 게시 직전에 다시 읽어 확인 */
  await loadSectionSources(sec, true);
  var lost = sec.words.concat(sec.phrases, [sec.full]).filter(function(r){ return Core.rowFileKind(sec, r) && !rowFile(r, sec, lang); }).length;
  if(lost){ toast('서버에서 불러오지 못한 소리 파일이 ' + lost + '곳 있어요. 잠시 뒤 다시 해 보거나 파일을 다시 올려 주세요.'); return; }
  if(Core.normText(sec.text) !== Core.normText(curVerse(lang))){
    toast('등록된 말씀 글자가 바뀌었어요. [자동 생성]을 다시 눌러 주세요.'); return;
  }
  var problems = [];
  if(!Core.checkOriginal(sec).ok) problems.push('구절 글자를 이어 붙인 내용이 등록한 원문과 달라요.');
  var rows = sec.words.concat(sec.phrases);
  var noKo = rows.filter(function(r){ return !r.ko; }).length;
  if(noKo) problems.push('한국어 뜻이 비어 있는 곳이 ' + noKo + '개 있어요.');
  var unheard = rows.filter(function(r){ return Core.rowFileKind(sec, r) && !(r.id && Adm.played[r.id]); }).length;
  if(unheard) problems.push('아직 미리듣기를 하지 않은 소리가 ' + unheard + '개 있어요(소리 파일 · 구간).');
  var noVoice = rows.filter(function(r){ return !Core.rowFileKind(sec, r) && !Core.ttsConfirmed(lang, r); }).length;
  if(noVoice) problems.push('소리 파일도 없고 기기 음성도 확인하지 않은 곳이 ' + noVoice + '개 있어요. 그 곳은 아이들에게 "소리 준비 중"으로 보이고, 확인하지 않은 기기 음성은 켜지지 않아요.');
  if(sec.versionName && !sec.credit) problems.push('번역본(' + sec.versionName + ')은 적었지만 출처 표기 문구는 비어 있어요. 번역본에 따라 표기가 필요할 수 있어요.');
  if(lang === 'zh'){
    var badPy = sec.phrases.concat(sec.words).filter(function(r){ return r.pinyin && r.pinyin.split(/\s+/).length !== Core.hanCount(r.text); }).length;
    if(badPy) problems.push('병음 음절 수가 한자 수와 다른 곳이 ' + badPy + '개 있어요(그 곳은 병음이 한 줄로 따로 표시돼요).');
    var noPy = sec.phrases.concat(sec.words).filter(function(r){ return !r.pinyin; }).length;
    if(noPy) problems.push('병음이 비어 있는 곳이 ' + noPy + '개 있어요.');
  }
  if(problems.length && !window.confirm(problems.join('\n') + '\n\n그래도 게시할까요?')) return;
  try{
    sec.updatedAt = Date.now(); sec.publishedAt = Date.now();
    await saveDoc(lang, function(doc){ doc.draft = clone(sec); doc.published = clone(sec); });
    Adm.work[lang] = clone(sec); Adm.dirty[lang] = false;
    /* 게시한 말씀을 지난 말씀 보관함에도 저장 (실패해도 게시는 그대로 성공) */
    var archMsg = '';
    try{ await Arch.save(lang, sec); }catch(e){ archMsg = ' (지난 말씀 보관함 저장은 실패했어요. 선생님 화면의 [지금 게시된 말씀 보관하기]를 눌러 주세요)'; }
    Arch.idx = null; Arch.autoDone = true;
    toast(L.short + ' 연습실을 게시했어요! 🌱' + archMsg);
    rerenderLang(lang);
  }catch(e){ toast(String(e.message || e)); }
}
/* 관리자 화면의 음원 플레이어를 누르면 구간 미리듣기는 멈춤 */
document.addEventListener('play', function(ev){
  var t = ev.target;
  if(t && t.id && (t.id.indexOf('adm-audio-') === 0 || t.id.indexOf('adm-waudio-') === 0)) stopSounds();
}, true);

   시작

// 드림씨드 앱과 똑같은 동물 그림 (읽기 전용으로 이름 옆에 보여주기 위함)
var AVATARS = [
  '🐥','🐻','🐶','🐱','🦊','🐰','🐯','🦁','🐨','🐼','🐷','🐸','🦄','🐢','🐬','🦖',
  '🐮','🐵','🐔','🦉','🐝','🐞','🦋','🐙','🦈','🐳','🦒','🦓','🐘','🦔','🐿️','🦥',
  '🦩','🐴','🐊','🦌'
];
function avatarFor(id){
  var h = 0;
  for(var i=0;i<id.length;i++){ h = (h * 31 + id.charCodeAt(i)) >>> 0; }
  return AVATARS[h % AVATARS.length];
}
function avatarOf(child){ return (child && child.avatar) || avatarFor(child.id); }

async function boot(){
  renderLoading('불러오는 중…');
  App.pinyinOn = lsGet('dsStudyPinyin') !== '0';
  try{ App.appState = await Fb.readAppState(); }
  catch(e){ renderFatal('서버에서 정보를 불러오지 못했어요. 인터넷을 확인하고 다시 시도해 주세요.'); return; }
  try{
    var r = await Promise.all([Fb.readStudy('en'), Fb.readStudy('zh')]);
    App.docs.en = r[0]; App.docs.zh = r[1];
  }catch(e){ renderFatal('학습 내용을 불러오지 못했어요. 인터넷을 확인하고 다시 시도해 주세요.'); return; }
  var cid = null;
  try{ cid = new URLSearchParams(location.search).get('c'); }catch(e){}
  cid = cid || lsGet(LAST_CHILD_KEY);
  App.child = ((App.appState.children) || []).filter(function(c){ return c.id === cid; })[0] || null;
  if(!App.child && !App.adminOk){ renderNoChild(); return; }
  renderHome();
}
boot();
