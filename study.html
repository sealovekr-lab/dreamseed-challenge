<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>드림씨드 말씀 연습실</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#FFF8EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EC; --card:#FFFFFF; --ink:#2B2A45; --ink-soft:#6B6780; --muted:#C9C2AE;
    --dawn:#E4574A; --dawn-soft:#FCE0DC; --dusk:#3B72D9; --dusk-soft:#DCE7FA;
    --leaf:#3F9C6E; --leaf-soft:#DEF3E7; --gold:#F0AE2E; --danger:#D9584C;
    --radius:22px; --shadow:0 8px 24px rgba(43,42,69,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Noto Sans KR','Noto Sans SC','Apple SD Gothic Neo',sans-serif; min-height:100vh; -webkit-tap-highlight-color:transparent;}
  .display{font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400;}
  .hidden{display:none !important;}
  button{font-family:inherit; cursor:pointer;}
  #app{max-width:520px; margin:0 auto; min-height:100vh; padding:0 16px 60px;}
  #app.wide{max-width:860px;}

  /* top bar */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 2px 6px; gap:8px;}
  .topbar .back{display:inline-flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--muted); border-radius:16px; padding:9px 14px; font-size:14px; font-weight:700; color:var(--ink); text-decoration:none; box-shadow:var(--shadow);}
  .topbar .who{font-size:15px; font-weight:700;}

  .btn{border:none; border-radius:16px; padding:13px 18px; font-size:15px; font-weight:700; color:#fff; background:var(--ink);}
  .btn:active{transform:scale(0.97);}
  .btn.leaf{background:var(--leaf);} .btn.dawn{background:var(--dawn);} .btn.dusk{background:var(--dusk);} .btn.gold{background:var(--gold); color:var(--ink);}
  .btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--muted);}
  .btn.block{width:100%;} .btn.big{padding:16px 22px; font-size:18px; border-radius:20px;}
  .btn.small{padding:8px 12px; font-size:13px; border-radius:12px;}
  .btn:disabled{opacity:0.45; cursor:default;}

  /* hero */
  .hero{background:linear-gradient(180deg,var(--dawn-soft),#FFF1DD); border-radius:26px; padding:20px 18px 18px; text-align:center; box-shadow:var(--shadow); margin-top:8px;}
  .hero-title{font-size:27px; margin:0 0 6px;}
  .hero-ref{display:inline-block; background:#fff; border-radius:14px; padding:5px 12px; font-weight:900; font-size:15px; margin-bottom:8px;}
  .hero-ko{font-size:14px; line-height:1.7; color:var(--ink); margin:0;}

  /* language cards */
  .lang-card{display:flex; align-items:center; gap:14px; background:var(--card); border-radius:24px; padding:18px; margin-top:16px; box-shadow:var(--shadow); border:3px solid transparent;}
  .lang-card.en{border-color:var(--dusk-soft);} .lang-card.zh{border-color:var(--dawn-soft);}
  .lang-card.off{opacity:0.7;}
  .lc-flag{font-size:38px;}
  .lc-body{flex:1; min-width:0;}
  .lc-body h2{margin:0 0 4px; font-size:19px; word-break:keep-all;}
  .lang-card .btn.big{padding:14px 18px; font-size:17px; flex-shrink:0;}
  .lc-sub{font-size:12.5px; color:var(--ink-soft);}
  .lc-steps{display:flex; gap:10px; margin-top:8px; font-size:12px; color:var(--ink-soft);}
  .lc-steps span{display:flex; flex-direction:column; align-items:center; gap:1px;}
  .lc-steps .em{font-size:22px;}
  .lc-steps .done .em{animation:none;}

  /* steps tabs */
  .steps{display:flex; gap:8px; margin:10px 0 14px;}
  .step-tab{word-break:keep-all; flex:1; border:2px solid var(--muted); background:var(--card); border-radius:18px; padding:10px 4px; font-size:13px; font-weight:700; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:2px;}
  .step-tab .no{font-size:20px;}
  .step-tab.active{border-color:var(--leaf); color:var(--ink); background:var(--leaf-soft);}
  .step-tab.done .no::after{content:" ✔"; color:var(--leaf); font-size:15px;}
  .lang-title{display:flex; align-items:center; gap:10px; margin:6px 0 0;}
  .lang-title h1{margin:0; font-size:24px;}
  .help{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:4px 2px 12px;}

  /* word cards */
  .word-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .word-card{background:var(--card); border-radius:22px; padding:16px 10px 14px; text-align:center; box-shadow:var(--shadow); border:3px solid transparent; position:relative;}
  .word-card.heard{border-color:var(--leaf);}
  .word-card .check{position:absolute; top:8px; right:10px; color:var(--leaf); font-size:18px; font-weight:900;}
  .word-text{font-size:28px; font-weight:900; line-height:1.25; overflow-wrap:break-word;}
  .word-text.l1{font-size:24px;} .word-text.l2{font-size:20px;}
  .word-text.zh{font-size:36px; font-weight:700;}
  .word-ko{font-size:15px; color:var(--ink-soft); margin:6px 0 10px;}
  .py{font-size:15px; color:var(--dusk); font-weight:700; line-height:1.3;}
  /* 병음: 글자마다 칸을 따로 줘서 서로 겹치지 않게 함 */
  .rb{display:inline-flex; flex-direction:column; align-items:center; margin:0 1px; vertical-align:bottom;}
  .rb .rt{font-size:12.5px; line-height:1.25; color:var(--dusk); font-weight:700; white-space:nowrap; min-height:1.25em;}
  .rb .rc{line-height:1.3;}
  .pbtns{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .pbtn{min-width:56px; min-height:52px; border-radius:18px; border:none; background:var(--dusk); color:#fff; font-size:20px; font-weight:700; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:5px;}
  .pbtn.alt{background:var(--leaf);} .pbtn.talk{background:var(--gold); color:var(--ink);} .pbtn.light{background:var(--card); color:var(--ink); border:2px solid var(--muted);}
  .pbtn .lab{font-size:13px;}
  .pbtn:active{transform:scale(0.95);}
  .word-card .pbtns{flex-wrap:nowrap; gap:6px;} .word-card .pbtn{min-width:0; flex:1; padding:0 6px;}
  .pbtn:disabled{opacity:0.4;}
  .pbtn.playing{animation:pulse 1.1s infinite; outline:3px solid var(--gold);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,174,46,.55);}70%{box-shadow:0 0 0 14px rgba(240,174,46,0);}100%{box-shadow:0 0 0 0 rgba(240,174,46,0);}}
  .dictlink{display:inline-block; margin-top:8px; font-size:12px; color:var(--ink-soft); text-decoration:none; padding:3px 10px; border-radius:999px; background:#F4EFE2;}
  .nosound{word-break:keep-all; line-height:1.45; font-size:12.5px; color:var(--ink-soft); background:#F4EFE2; border-radius:12px; padding:7px 10px;}

  /* phrase cards */
  .phrase-card{background:var(--card); border-radius:22px; padding:16px 14px; margin-bottom:12px; box-shadow:var(--shadow); border:3px solid transparent;}
  .phrase-card.done{border-color:var(--leaf); background:#F7FCF9;}
  .phrase-no{font-size:12px; font-weight:900; color:var(--ink-soft); margin-bottom:4px;}
  .phrase-text{font-size:23px; font-weight:700; line-height:1.55; word-break:break-word;}
  .phrase-text.zh{font-size:26px; line-height:1.5;}
  .phrase-ko{font-size:15px; color:var(--ink-soft); margin:6px 0 12px; line-height:1.6;}
  .py-line{font-size:15px; color:var(--dusk); font-weight:700; margin-top:2px;}
  .follow-wrap{margin-top:10px;}
  .follow-bar{height:14px; background:var(--leaf-soft); border-radius:8px; overflow:hidden;}
  .follow-bar i{display:block; height:100%; width:0; background:var(--leaf);}
  .follow-label{font-size:15px; font-weight:900; color:var(--leaf); margin-bottom:4px;}
  .donebtn{margin-top:10px;}

  /* toggles row */
  .toggle-row{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px;}
  .chip{border:2px solid var(--muted); background:var(--card); border-radius:20px; padding:8px 14px; font-size:14px; font-weight:700; color:var(--ink);}
  .chip.on{border-color:var(--leaf); background:var(--leaf-soft);}

  /* full verse */
  .full-card{background:var(--card); border-radius:24px; padding:18px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
  .full-text{font-size:22px; line-height:1.75; font-weight:500; word-break:break-word;}
  .full-text.zh{font-size:25px; line-height:1.5;}
  .masked{filter:blur(9px); user-select:none; -webkit-user-select:none; transition:filter .15s;}
  .peek-hint{font-size:13px; color:var(--ink-soft); margin-top:8px;}
  .rec-box{background:#FFF4E2; border-radius:22px; padding:16px; text-align:center; margin-top:14px;}
  .rec-box h3{margin:0 0 4px; font-size:17px;}
  .rec-note{font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:4px 0 10px;}
  .rec-btns{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .rec-timer{font-family:'Jua',sans-serif; font-size:24px; margin:6px 0; color:var(--danger);}
  .rec-box audio{width:100%; margin-top:10px;}
  .mic.recording{animation:pulse 1.1s infinite; background:var(--danger) !important; color:#fff !important;}

  /* sprout celebration */
  .sprout{position:fixed; inset:0; background:rgba(43,42,69,0.45); display:flex; align-items:center; justify-content:center; z-index:300;}
  .sprout .box{background:#fff; border-radius:28px; padding:26px 30px; text-align:center; box-shadow:var(--shadow); animation:pop .35s ease;}
  .sprout .tree{font-size:70px; display:block; animation:grow 1.2s ease forwards;}
  .sprout .msg{font-family:'Jua',sans-serif; font-size:22px; margin-top:6px;}
  @keyframes grow{0%{transform:scale(0.3) translateY(14px); opacity:0;}50%{transform:scale(1.25);opacity:1;}100%{transform:scale(1);}}
  @keyframes pop{from{transform:scale(0.8); opacity:0;}to{transform:scale(1); opacity:1;}}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:20px; font-size:14px; z-index:400; box-shadow:var(--shadow); opacity:0; transition:opacity .25s ease; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}
  .center-msg{text-align:center; padding:60px 16px; color:var(--ink-soft); line-height:1.8;}
  .spinner{width:34px; height:34px; border-radius:50%; border:4px solid var(--muted); border-top-color:var(--dawn); animation:spin .8s linear infinite; margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .foot{text-align:center; margin-top:26px;}
  .linkbtn{background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:13px;}
  .banner{border-radius:16px; padding:11px 14px; font-size:13.5px; line-height:1.6; margin:10px 0;}
  .banner.warn{background:#FFF1D6; color:#7A5300;} .banner.info{background:var(--dusk-soft); color:#1E3F85;} .banner.ok{background:var(--leaf-soft); color:#1E6B47;} .banner.bad{background:var(--dawn-soft); color:#8C2B22;}

  /* modal (PIN) */
  .overlay{position:fixed; inset:0; background:rgba(43,42,69,0.55); display:flex; align-items:center; justify-content:center; z-index:250; padding:20px;}
  .modal{background:var(--bg); width:100%; max-width:380px; border-radius:26px; padding:24px 22px; text-align:center;}
  .modal h2{margin:0 0 6px; font-size:20px;} .modal p{color:var(--ink-soft); font-size:14px; margin:0 0 14px;}
  input[type=text], input[type=number], input[type=password], textarea, select{padding:10px 12px; border-radius:12px; border:2px solid var(--muted); font-size:15px; font-family:inherit; background:#fff; color:var(--ink); width:100%;}
  input:focus, textarea:focus{outline:2px solid var(--dawn); outline-offset:1px;}

  /* ===== admin ===== */
  .adm h1{font-size:24px; margin:10px 0 4px;}
  .adm-card{background:var(--card); border-radius:20px; padding:16px; margin:14px 0; box-shadow:var(--shadow);}
  .adm-card h2{margin:0 0 8px; font-size:18px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .badge{display:inline-block; border-radius:12px; padding:3px 10px; font-size:12px; font-weight:700; background:#EEE9DA; color:var(--ink-soft);}
  .badge.pub{background:var(--leaf-soft); color:#1E6B47;} .badge.draft{background:var(--dusk-soft); color:#1E3F85;} .badge.warn{background:#FFF1D6; color:#7A5300;}
  .verse-box{background:#FAF7EF; border-radius:14px; padding:10px 12px; font-size:13.5px; line-height:1.6; margin:6px 0; word-break:break-word;}
  .sec-title{font-weight:900; font-size:14.5px; margin:16px 0 6px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .row{border:1.5px solid #EEE7D4; border-radius:14px; padding:10px; margin-bottom:8px; background:#FFFDF8;}
  .row .r1{display:grid; grid-template-columns:1fr; gap:6px;}
  .row .r2{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px;}
  .row label{font-size:12px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px;}
  .row input[type=number]{width:84px; padding:7px 8px; font-size:14px;}
  .row .r3{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; padding-top:8px; border-top:1px dashed #E6DDC6;}
  .row .r3 .tts-lab{font-size:12px; font-weight:900; color:var(--dusk);}
  .row .r3 input.say{flex:1 1 200px; min-width:0; padding:7px 8px; font-size:14px;}
  .row .r3 .tts-state{flex-basis:100%; font-size:12px; color:var(--ink-soft);}
  .row .r3 .tts-note{flex-basis:100%; font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
  .row .r4{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; padding-top:8px; border-top:1px dashed #E6DDC6;}
  .row .r4 .tts-lab{font-size:12px; font-weight:900; color:var(--leaf);}
  .row .r4 select{flex:1 1 170px; min-width:0; padding:7px 8px; font-size:14px;}
  .row .r4 .src-note{font-size:12px; color:var(--ink-soft); word-break:break-all;}
  .own-box{background:#F4FAF6; border:1px solid #CFE8D8; border-radius:14px; padding:10px 12px; margin:8px 0;}
  .own-box .own-h{font-weight:900; font-size:14px; color:var(--leaf); margin-bottom:4px;}
  .own-box .own-info{font-size:13px; margin:6px 0 2px; word-break:break-all;}
  .own-box .own-msg{font-size:13px; margin-top:6px; line-height:1.5; color:var(--ink);}
  .own-box .own-msg:empty{display:none;}
  .ver-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;} .ver-row select,.ver-row input{flex:1 1 160px; min-width:0;}
  .voice-tag{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
  .ver-line{font-size:13px; color:var(--ink-soft); margin:-4px 2px 10px; text-align:left;}
  .credit{font-size:11.5px; color:var(--ink-soft); line-height:1.55; margin:18px 4px 4px; white-space:pre-line; border-top:1px solid #EADFC4; padding-top:10px;}
  .row .tiny{padding:6px 9px; font-size:12.5px; border-radius:10px; border:1.5px solid var(--muted); background:#fff; font-weight:700; color:var(--ink);}
  .row.played{border-color:var(--leaf);}
  .cand{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px;}
  .cand button{border:1.5px dashed var(--dusk); background:#fff; color:var(--dusk); border-radius:14px; padding:5px 11px; font-size:13px; font-weight:700;}
  .progress-line{font-size:13.5px; color:var(--ink); background:var(--dusk-soft); padding:10px 12px; border-radius:12px; margin:8px 0; line-height:1.6;}
  .actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  @media (max-width:560px){ .grid2{grid-template-columns:1fr;} .word-grid{gap:10px;} }
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px;}
  .dirty{color:var(--danger); font-weight:700; font-size:12.5px;}

  /* ---- 말씀 퀴즈 · 나의 보석함 (연습실 안) ---- */
  .qz-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .qz-card{display:flex; flex-direction:column; align-items:center; gap:2px; border:3px solid transparent; border-radius:24px; padding:14px 8px 12px; box-shadow:var(--shadow); color:var(--ink); font-family:inherit; text-align:center; transition:transform .12s ease;}
  .qz-card:active{transform:scale(0.96);}
  .qz-quiz{background:linear-gradient(180deg,#FFF6D6,#FFEBB0); border-color:#F6D77A;}
  .qz-gems{background:linear-gradient(180deg,#F1E9FF,#E3D6FB); border-color:#CDB8F3;}
  .qz-quiz.off{opacity:0.7;} .qz-quiz.done{border-color:var(--leaf); background:linear-gradient(180deg,#F1FAF4,#DEF3E7);}
  .qz-ico{font-size:34px; line-height:1.2; animation:qzBob 3s ease-in-out infinite;}
  .qz-t{font-size:16px; font-weight:900;} .qz-s{font-size:12.5px; color:var(--ink-soft); font-weight:700; word-break:keep-all;}
  @keyframes qzBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .qz-wrap{margin-top:6px;}
  .qz-title{font-size:19px; font-weight:900; text-align:center; margin:10px 0 6px;} .qz-no{font-size:13px; color:var(--ink-soft); font-weight:700; margin-left:4px;}
  .qz-dots{display:flex; justify-content:center; gap:8px; margin-bottom:12px;}
  .qz-dot{width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--muted);}
  .qz-dot.cur{border-color:var(--gold); background:#FFF3C9;} .qz-dot.ok{background:var(--leaf); border-color:var(--leaf);} .qz-dot.no{background:#F5B8B1; border-color:#F5B8B1;}
  .arch-card{display:flex; align-items:center; gap:12px; width:100%; margin-top:14px; background:linear-gradient(135deg,#FFF3D9,#FFE9C2); border:3px solid #FFD98A; border-radius:24px; padding:12px 14px; box-shadow:var(--shadow); color:var(--ink); font-family:inherit; text-align:left; transition:transform .12s ease;}
  .arch-card:active{transform:scale(0.98);}
  .arch-ico{font-size:34px; line-height:1;}
  .arch-body{display:flex; flex-direction:column; flex:1; min-width:0; gap:2px;}
  .arch-go{flex-shrink:0; background:var(--gold); color:var(--ink); font-weight:900; font-size:13px; padding:6px 11px; border-radius:999px;}
  .arch-list{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .arch-item{display:flex; align-items:center; gap:12px; width:100%; background:var(--card); border:3px solid var(--leaf-soft); border-radius:20px; padding:12px 14px; box-shadow:var(--shadow); color:var(--ink); font-family:inherit; text-align:left;}
  .arch-item.zh{border-color:var(--dawn-soft);}
  .arch-item:active{transform:scale(0.98);}
  .ai-flag{font-size:30px; line-height:1;}
  .ai-body{display:flex; flex-direction:column; flex:1; min-width:0; gap:2px;}
  .ai-ref{font-size:16px; font-weight:900;}
  .ai-sub{font-size:13px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ai-date{flex-shrink:0; font-size:12.5px; font-weight:800; color:var(--ink-soft); text-align:right;}
  .ai-nosound{font-weight:700; color:#8C6B00;}
  .qz-card-q{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:16px 14px 18px; text-align:center; border:3px solid #FFEBB0;}
  .qz-flag{display:inline-block; font-size:12.5px; font-weight:900; background:#FFF6D6; border-radius:999px; padding:3px 11px; color:var(--ink-soft);}
  .qz-head{font-size:15px; font-weight:800; margin:10px 0 8px; color:var(--ink-soft);}
  .qz-big{font-size:30px; font-weight:900; line-height:1.4; margin:4px 0 10px; word-break:keep-all; overflow-wrap:anywhere;}
  .qz-big.zh{font-size:34px;} .qz-big.sm{font-size:21px; line-height:1.7; font-weight:800;} .qz-big.ko{font-size:26px; color:var(--dusk);}
  .qz-blank{display:inline-block; min-width:2.4em; border-bottom:4px solid var(--gold); color:var(--leaf); margin:0 4px;}
  .qz-hint{font-size:14px; color:var(--ink-soft); line-height:1.6;}
  .qz-play{margin:2px auto 4px;} .qz-play.big{min-width:150px; min-height:72px; font-size:28px; margin:6px auto 8px;}
  .qz-opts{display:grid; gap:10px; margin-top:14px;}

<script>
/* ============================================================
   드림씨드 말씀 연습실 (study.html)
   - 기존 앱(index.html)의 데이터를 "읽기만" 합니다. (app_state, verseAudioFile:*)
   - 새로 쓰는 곳은 오직 studyRoom/ 아래입니다: studyRoom/en, studyRoom/zh(말씀 내용),
     studyRoom/clips/<id>(선생님이 올린 소리 파일: 전용 음원 · 단어 낭독 파일 · 줄별 소리),
     studyRoom/gems/<아이ID>/…, studyRoom/gemsConfig (퀴즈 보석 기록·교환 기록·교환표),
     studyRoom/archive/…, studyRoom/archiveIdx/… (지난 말씀 보관함).
   ============================================================ */
var FIREBASE_DB_URL = "https://dreamseed-833e5-default-rtdb.asia-southeast1.firebasedatabase.app";
var LAST_CHILD_KEY = 'dreamseed_last_child_id';
// 선생님이 [연습실 자동 생성]을 누를 때만 쓰는 무료 도구들 (아이들 화면에서는 내려받지 않습니다)
var CDN = {
  transformers: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/+esm',
  pinyin: 'https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/+esm',
  whisperModel: 'onnx-community/whisper-base_timestamped'
};

/* ---------------- 저장소 (Firebase REST) ---------------- */
var Fb = (function(){
  var BASE = FIREBASE_DB_URL.replace(/\/+$/, '');
  function url(path){ return BASE + '/storage/' + path.split('/').map(encodeURIComponent).join('/') + '.json'; }
  async function getRaw(path){
    var r = await fetch(url(path));
    if(!r.ok) throw new Error('get failed ' + r.status);
    return r.json();
  }
  async function put(path, str){
    // 안전장치: 연습실은 studyRoom/ 아래에만 쓸 수 있습니다. (기존 데이터는 절대 건드리지 않음)
    if(path.indexOf('studyRoom/') !== 0) throw new Error('blocked path: ' + path);
    var r = await fetch(url(path), { method:'PUT', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(str) });
    if(!r.ok) throw new Error('put failed ' + r.status);
    return true;
  }
  function okCid(c){ return typeof c === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(c); }
  function okDate(d){ return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d); }
  function okLang(l){ return l === 'en' || l === 'zh'; }
  function okAid(id){ return typeof id === 'string' && /^[A-Za-z0-9_-]{6,40}$/.test(id); }
  async function withRetry(fn){
    var waits = [0, 500, 1200], last = null;
    for(var i=0;i<waits.length;i++){
      if(waits[i]) await new Promise(function(r){ setTimeout(r, waits[i]); });
      try{ return await fn(); }catch(e){ last = e; }
    }
    throw last;
  }
  return {
    readAppState: function(){ return withRetry(async function(){
      var v = await getRaw('app_state');
      if(v === null || typeof v === 'undefined') throw new Error('no app_state');
      return JSON.parse(v);
    }); },
    readStudy: function(lang){ return withRetry(async function(){
      var v = await getRaw('studyRoom/' + lang);
      return v ? JSON.parse(v) : null;
    }); },
    writeStudy: function(lang, doc){ return put('studyRoom/' + lang, JSON.stringify(doc)); },
    /* 선생님이 올린 소리 파일(데이터 주소 글자) — studyRoom/clips/<id> 에만 저장. 한 번 저장한 파일은 고치지 않고 새 id로 올림 */
    putClip: function(id, dataUrl){ return put('studyRoom/clips/' + id, dataUrl); },
    readClip: function(id){ return withRetry(async function(){
      var v = await getRaw('studyRoom/clips/' + id);
      if(typeof v !== 'string' || v.indexOf('data:') !== 0) throw new Error('no clip');
      return v;
    }); },
    /* 퀴즈 보석 기록 (studyRoom/gems/<아이ID>/…) — 아이 화면은 자기 ID의 days/<날짜> 한 곳에만 쓰고,
       선생님 화면만 adj/<기록ID>(교환·조정)와 studyRoom/gemsConfig(교환표)를 씀. app_state·말씀정원과 무관 */
    readGems: function(cid){ return withRetry(async function(){ if(!okCid(cid)) throw new Error('bad child'); return getRaw('studyRoom/gems/' + cid); }); },
    readAllGems: function(){ return withRetry(function(){ return getRaw('studyRoom/gems'); }); },
    readGemConfig: function(){ return withRetry(function(){ return getRaw('studyRoom/gemsConfig'); }); },
    putGemDay: function(cid, date, obj){ if(!okCid(cid) || !okDate(date)) throw new Error('bad gem path'); return put('studyRoom/gems/' + cid + '/days/' + date, obj); },
    putGemAdj: function(cid, id, obj){ if(!okCid(cid) || !okAid(id)) throw new Error('bad gem path'); return put('studyRoom/gems/' + cid + '/adj/' + id, obj); },
    putGemConfig: function(obj){ return put('studyRoom/gemsConfig', obj); },
    /* 지난 말씀 보관함 (studyRoom/archive/<언어>/<id> = 말씀 내용, studyRoom/archiveIdx/<언어>/<id> = 목록용 짧은 정보)
       — 선생님 화면만 씀(게시할 때 자동 · 보관 버튼). 아이 화면은 읽기만 함. 기존 데이터·말씀정원과 무관 */
    readArchiveIdx: function(){ return withRetry(function(){ return getRaw('studyRoom/archiveIdx'); }); },
    readArchive: function(lang, id){ return withRetry(async function(){
      if(!okLang(lang) || !okAid(id)) throw new Error('bad archive path');
      var v = await getRaw('studyRoom/archive/' + lang + '/' + id);
      return v ? JSON.parse(v) : null;
    }); },
    putArchive: function(lang, id, sec){ if(!okLang(lang) || !okAid(id)) throw new Error('bad archive path'); return put('studyRoom/archive/' + lang + '/' + id, JSON.stringify(sec)); },
    putArchiveIdx: function(lang, id, obj){ if(!okLang(lang) || !okAid(id)) throw new Error('bad archive path'); return put('studyRoom/archiveIdx/' + lang + '/' + id, obj); },
    readAudioDataUrl: async function(lang){
      var v = await getRaw('verseAudioFile/' + lang);
      if(!v || typeof v !== 'string') return null;
      return v;
    }
  };
})();

/* ---------------- 핵심 도구들 (화면과 상관없는 계산) ---------------- */
var Core = {};
Core.uid = function(){ return 'i' + Math.random().toString(36).slice(2, 9); };
Core.esc = function(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
};
Core.r2 = function(x){ return Math.round(x * 100) / 100; };
Core.normText = function(s){
  return String(s || '').replace(/[\s　]+/g, '').replace(/[，。！？；：、,.!?;:'"“”‘’「」『』()（）\-—…]/g, '').toLowerCase();
};
Core.normEn = function(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9']/g, '').replace(/^'+|'+$/g, ''); };
Core.hanOnly = function(s){ return String(s || '').replace(/[^一-鿿]/g, ''); };
Core.hanCount = function(s){ return Core.hanOnly(s).length; };

Core.stampOf = function(uploadedAt, len){ return 'at:' + (uploadedAt || '') + '|len:' + (len || 0); };
Core.stampParts = function(stamp){
  var m = /^at:(.*)\|len:(\d+)$/.exec(String(stamp || ''));
  return m ? { at: m[1], len: parseInt(m[2], 10) } : { at: '', len: 0 };
};

/* ----- 영어: 짧은 구절로 나누기 ----- */
var EN_BREAK = ['for','and','but','that','who','which','when','where','wherever','because','so','or','will','shall','with','by','through'];
Core.splitLongEn = function(p){
  var words = p.split(/\s+/).filter(Boolean);
  if(words.length <= 9) return [p];
  var n = words.length, mid = n / 2, best = -1, bestD = 1e9;
  for(var i=3; i<=n-3; i++){
    if(EN_BREAK.indexOf(Core.normEn(words[i])) >= 0){
      var d = Math.abs(i - mid);
      if(d < bestD){ bestD = d; best = i; }
    }
  }
  if(best < 0) best = Math.round(mid);
  var a = words.slice(0, best).join(' '), b = words.slice(best).join(' ');
  return Core.splitLongEn(a).concat(Core.splitLongEn(b));
};
Core.splitPhrasesEn = function(text){
  text = String(text || '').replace(/\s+/g, ' ').trim();
  if(!text) return [];
  var sentences = text.match(/[^.?!]+[.?!]*["”’']*/g) || [text];
  var pieces = [];
  sentences.forEach(function(s){
    s = s.trim(); if(!s) return;
    var parts = (s.match(/[^;:,]+[;:,]*/g) || [s]).map(function(p){ return p.trim(); }).filter(Boolean);
    var merged = [];
    parts.forEach(function(p){
      var wc = p.split(/\s+/).length;
      if(merged.length && wc < 3){ merged[merged.length-1] += ' ' + p; } else { merged.push(p); }
    });
    if(merged.length > 1 && merged[0].split(/\s+/).length < 3){ merged[1] = merged[0] + ' ' + merged[1]; merged.shift(); }
    merged.forEach(function(p){ pieces.push(p); });
  });
  var out = [];
  pieces.forEach(function(p){ Core.splitLongEn(p).forEach(function(x){ out.push(x); }); });
  return out;
};
Core.tokenizeEn = function(text){
  return String(text || '').split(/\s+/).filter(Boolean).map(function(raw){ return { raw: raw, norm: Core.normEn(raw) }; });
};

/* ----- 중국어: 짧은 구절로 나누기 ----- */
Core.zhSegmenter = function(){
  try{ if(typeof Intl !== 'undefined' && Intl.Segmenter) return new Intl.Segmenter('zh', { granularity:'word' }); }catch(e){}
  return null;
};
Core.splitLongZh = function(p){
  if(Core.hanCount(p) <= 12) return [p];
  var seg = Core.zhSegmenter(), mid = Core.hanCount(p) / 2, cut = -1, acc = 0, bestD = 1e9, pos = 0;
  if(seg){
    var parts = Array.from(seg.segment(p)).map(function(s){ return s.segment; });
    for(var i=0;i<parts.length-1;i++){
      acc += Core.hanCount(parts[i]); pos += parts[i].length;
      var d = Math.abs(acc - mid);
      if(acc >= 3 && Core.hanCount(p) - acc >= 3 && d < bestD){ bestD = d; cut = pos; }
    }
  }
  if(cut < 0){
    // 글자 단위 중간
    var h = 0;
    for(var k=0;k<p.length;k++){ if(/[一-鿿]/.test(p[k])) h++; if(h >= Math.round(mid)){ cut = k + 1; break; } }
  }
  return Core.splitLongZh(p.slice(0, cut)).concat(Core.splitLongZh(p.slice(cut)));
};
Core.splitPhrasesZh = function(text){
  text = String(text || '').replace(/\s+/g, '').trim();
  if(!text) return [];
  var pieces = text.match(/[“‘「『（(]*[^，。！？；：、,.!?;:]+[，。！？；：、,.!?;:]*[”’」』）)]*/g) || [text];
  var merged = [];
  for(var i=0;i<pieces.length;i++){
    var p = pieces[i];
    // 짧은 쉼표 조각은 다음 조각과 합침
    while(Core.hanCount(p) < 5 && /[，、；：,;:]$/.test(p) && i + 1 < pieces.length){ p += pieces[++i]; }
    merged.push(p);
  }
  if(merged.length > 1 && Core.hanCount(merged[merged.length-1]) < 3){
    var last = merged.pop(); merged[merged.length-1] += last;
  }
  var out = [];
  merged.forEach(function(p){ Core.splitLongZh(p).forEach(function(x){ out.push(x); }); });
  return out;
};

/* ----- 영어: 소리 인식 결과(단어+시간)를 등록한 본문에 맞추기 ----- */
function editDist1(a, b){
  if(a === b) return 0;
  if(Math.abs(a.length - b.length) > 1) return 2;
  var i = 0, j = 0, edits = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    edits++; if(edits > 1) return 2;
    if(a.length > b.length) i++; else if(a.length < b.length) j++; else { i++; j++; }
  }
  edits += (a.length - i) + (b.length - j);
  return edits;
}
function simEn(a, b){
  if(a === b) return 2;
  if(a.length >= 4 && b.length >= 4 && editDist1(a, b) <= 1) return 1;
  return -1;
}
/* 반환: 본문 단어마다 whisper 단어 번호(없으면 -1). 앞부분/뒷부분은 공짜로 건너뜀(출처 낭독, 반복 낭독) */
Core.alignEn = function(reg, w){
  var n = reg.length, m = w.length, i, j;
  var H = [], P = [];
  for(i=0;i<=n;i++){ H.push(new Array(m+1).fill(0)); P.push(new Array(m+1).fill(0)); }
  for(i=1;i<=n;i++){ H[i][0] = -i; P[i][0] = 1; }       // 1 = 본문 단어 건너뜀
  for(j=0;j<=m;j++){ H[0][j] = 0; P[0][j] = 2; }        // 2 = whisper 단어 건너뜀(앞부분 공짜)
  for(i=1;i<=n;i++){
    for(j=1;j<=m;j++){
      var d = H[i-1][j-1] + simEn(reg[i-1], w[j-1]);
      var u = H[i-1][j] - 1;
      var l = H[i][j-1] - 1;
      if(d >= u && d >= l){ H[i][j] = d; P[i][j] = 0; }
      else if(u >= l){ H[i][j] = u; P[i][j] = 1; }
      else { H[i][j] = l; P[i][j] = 2; }
    }
  }
  var bestJ = 0, bestV = -1e9;
  for(j=0;j<=m;j++){ if(H[n][j] > bestV){ bestV = H[n][j]; bestJ = j; } }   // 같은 점수면 앞쪽(첫 번째 낭독)
  var res = new Array(n).fill(-1);
  i = n; j = bestJ;
  while(i > 0 && j >= 0){
    var p = P[i][j];
    if(i === 0) break;
    if(j === 0){ i--; continue; }
    if(p === 0){ if(simEn(reg[i-1], w[j-1]) > 0) res[i-1] = j-1; i--; j--; }
    else if(p === 1){ i--; }
    else { j--; }
  }
  return res;
};

/* ----- 소리 크기(에너지) 분석 ----- */
Core.energy = function(pcm, sr){
  var fs = 0.02, w = Math.round(sr * fs), n = Math.floor(pcm.length / w), rms = new Array(n), i, j;
  for(i=0;i<n;i++){
    var s = 0, o = i * w;
    for(j=0;j<w;j++){ var x = pcm[o + j]; s += x * x; }
    rms[i] = Math.sqrt(s / w);
  }
  var sorted = rms.slice().sort(function(a, b){ return a - b; });
  var p90 = sorted[Math.floor(n * 0.9)] || 0;
  return { fs: fs, rms: rms, thr: Math.max(1e-5, 0.07 * p90), dur: pcm.length / sr, p90: p90 };
};
Core.isQuiet = function(E, i){ return E.rms[i] < E.thr; };
/* limit: 이 값(초)보다 멀리는 옮기지 않음. 다음 단어/구절을 삼키지 않도록 호출하는 쪽에서 정해 줌 */
Core.refineEnd = function(E, t, limit){
  if(!E) return t;
  limit = (limit == null) ? 0.5 : Math.max(0, limit);
  var n = E.rms.length, i = Math.max(0, Math.min(n - 1, Math.round(t / E.fs))), k, maxF = Math.round(limit / E.fs);
  if(!Core.isQuiet(E, i)){
    for(k=1;k<=maxF && i+k+1<n;k++){ if(Core.isQuiet(E, i+k) && Core.isQuiet(E, i+k+1)) return Core.r2((i + k) * E.fs + 0.04); }
    return t;
  }
  for(k=0;k<=Math.round(0.5 / E.fs) && i-k>=0;k++){ if(!Core.isQuiet(E, i-k)) return Core.r2(Math.min(t, (i - k + 1) * E.fs + 0.06)); }
  return t;
};
Core.refineStart = function(E, t, limit){
  if(!E) return t;
  limit = (limit == null) ? 0.3 : Math.max(0, limit);
  var n = E.rms.length, i = Math.max(0, Math.min(n - 1, Math.round(t / E.fs))), k;
  if(!Core.isQuiet(E, i)){
    var maxB = Math.round(limit / E.fs);
    for(k=1;k<=maxB && i-k-1>=0;k++){ if(Core.isQuiet(E, i-k) && Core.isQuiet(E, i-k-1)) return Core.r2(Math.max(0, (i - k + 1) * E.fs - 0.04)); }
    return t;
  }
  var maxF = Math.round(0.5 / E.fs);
  for(k=0;k<=maxF && i+k<n;k++){ if(!Core.isQuiet(E, i+k)) return Core.r2(Math.max(0, (i + k) * E.fs - 0.04)); }
  return t;
};
/* t가 조용한 곳이면 그 조용한 구간(시작,끝)을 돌려줌, 아니면 null */
Core.quietRunAround = function(E, t, maxHalf){
  if(!E || !E.rms.length) return null;
  var n = E.rms.length, i = Math.max(0, Math.min(n - 1, Math.round(t / E.fs))), lim = Math.round((maxHalf || 0.6) / E.fs);
  if(!Core.isQuiet(E, i)) return null;
  var a = i, b = i;
  while(a > 0 && i - a < lim && Core.isQuiet(E, a - 1)) a--;
  while(b < n - 1 && b - i < lim && Core.isQuiet(E, b + 1)) b++;
  return { s: a * E.fs, e: (b + 1) * E.fs };
};
Core.minEnergyTime = function(E, t0, t1){
  var a = Math.max(0, Math.floor(t0 / E.fs)), b = Math.min(E.rms.length - 1, Math.ceil(t1 / E.fs)), best = a, bv = 1e9, i, k;
  for(i=a;i<=b;i++){
    var s = 0, c = 0;
    for(k=Math.max(0,i-2); k<=Math.min(E.rms.length-1,i+2); k++){ s += E.rms[k]; c++; }
    var v = s / c;
    if(v < bv){ bv = v; best = i; }
  }
  return best * E.fs + E.fs / 2;
};

/* ----- 핵심 단어 후보 ----- */
var EN_STOP = ['the','a','an','and','or','but','of','to','in','on','at','by','for','with','from','as','is','are','was','were','be','been','am','do','does','did','not','no','have','has','had','i','you','your','he','she','it','we','they','my','me','him','her','his','our','their','this','that','these','those','will','shall','would','could','should','may','can','if','so','then','than','there','when','where','who','which','what','all','up','out','into','over','under','also','yet'];
Core.keywordCandidatesEn = function(text){
  var toks = Core.tokenizeEn(text), seen = {}, cands = [];
  toks.forEach(function(t, i){
    var clean = t.raw.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9']+$/g, '');
    var norm = Core.normEn(clean);
    if(!norm || seen[norm] || EN_STOP.indexOf(norm) >= 0) return;
    var prev = i > 0 ? toks[i-1].raw : '';
    var sentenceStart = (i === 0) || /[.?!]["”’']*$/.test(prev);
    var isName = (/^[A-Z]{3,}$/.test(clean)) || (/^[A-Z][a-z]+$/.test(clean) && !sentenceStart);
    if(norm.length < 5 && !isName) return;
    seen[norm] = true;
    cands.push({ text: clean, norm: norm, score: norm.length + (isName ? 3 : 0), order: cands.length });
  });
  var top = cands.slice().sort(function(a, b){ return b.score - a.score || a.order - b.order; }).slice(0, Math.min(5, cands.length));
  var picked = cands.filter(function(c){ return top.indexOf(c) >= 0; }).map(function(c){ return c.text; });
  return { cands: cands.map(function(c){ return c.text; }), picked: picked };
};
var ZH_STOP = ['不要','因为','你的','我的','他的','我们','你们','他们','没有','就是','这个','那个','自己','所以','但是','如果','什么','一个','也是','都是'];
Core.keywordCandidatesZh = function(text){
  var seg = Core.zhSegmenter();
  if(!seg) return { cands: [], picked: [] };
  var seen = {}, cands = [];
  Array.from(seg.segment(String(text || ''))).forEach(function(s){
    var w = s.segment;
    if(!s.isWordLike || Core.hanCount(w) < 2 || Core.hanCount(w) !== w.length) return;
    if(ZH_STOP.indexOf(w) >= 0 || seen[w]) return;
    seen[w] = true;
    cands.push({ text: w, score: w.length * 2, order: cands.length });
  });
  var top = cands.slice().sort(function(a, b){ return b.score - a.score || a.order - b.order; }).slice(0, Math.min(5, cands.length));
  var picked = cands.filter(function(c){ return top.indexOf(c) >= 0; }).map(function(c){ return c.text; });
  return { cands: cands.map(function(c){ return c.text; }), picked: picked };
};

/* ----- 병음 ----- */
Core._py = null;
Core.loadPinyin = async function(){
  if(Core._py) return Core._py;
  var m = await import(CDN.pinyin);
  Core._py = m.pinyin;
  return Core._py;
};
Core.pinyinOf = function(text){
  var py = Core._py;
  if(!py) return '';
  try{
    var arr = py(String(text || ''), { toneType: 'symbol', type: 'array' });
    return arr.filter(function(x){ return /[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/.test(x); }).join(' ');
  }catch(e){ return ''; }
};

/* ----- 자동 생성의 공통 부분 ----- */
function fillGaps(times, dur){
  var n = times.length, i = 0;
  while(i < n){
    if(times[i].m){ i++; continue; }
    var j = i; while(j < n && !times[j].m) j++;
    var run = j - i, lo, hi;
    if(i > 0 && j < n){ lo = times[i-1].e; hi = times[j].s; }
    else if(i === 0 && j < n){ hi = times[j].s; lo = Math.max(0, hi - 0.35 * run); }
    else if(i > 0 && j >= n){ lo = times[i-1].e; hi = lo + 0.35 * run; }
    else { lo = 0; hi = dur || (0.4 * n); }
    if(hi < lo) hi = lo + 0.1 * run;
    for(var k=0;k<run;k++){
      times[i+k].s = lo + (hi - lo) * k / run;
      times[i+k].e = lo + (hi - lo) * (k + 1) / run;
    }
    i = j;
  }
}
Core.baseSection = function(lang, ctx){
  var sec = {
    lang: lang, verseRef: ctx.ref || '', text: ctx.text, audioStamp: ctx.stamp || '',
    quality: 'ok', notes: [], passStart: 0, passEnd: 0,
    tokens: [], words: [], phrases: [], full: { start: 0, end: 0 }, createdAt: Date.now()
  };
  if(ctx.own) sec.own = ctx.own;     // 연습실 전용 전체 음원으로 만든 경우, 그 파일 정보
  return sec;
};
function mkRow(text, start, end, audio){
  return { id: Core.uid(), text: text, pinyin: '', ko: '', start: Core.r2(start), end: Core.r2(end), audio: !!audio };
}

/* ----- 영어 초안 만들기 ----- */
Core.buildDraftEn = function(ctx){
  var sec = Core.baseSection('en', ctx), E = ctx.E;
  var W = (ctx.whisper || []).map(function(w){ return { n: Core.normEn(w.text), t0: w.t0, t1: w.t1 }; });
  var toks = Core.tokenizeEn(ctx.text);
  var al = Core.alignEn(toks.map(function(t){ return t.norm; }), W.map(function(w){ return w.n; }));
  var matched = 0;
  var times = toks.map(function(t, i){
    var j = al[i];
    if(j >= 0){ matched++; return { s: W[j].t0, e: W[j].t1, m: true }; }
    return { s: 0, e: 0, m: false };
  });
  fillGaps(times, E ? E.dur : 0);
  var ratio = toks.length ? matched / toks.length : 0;
  if(ratio < 0.7){
    sec.quality = 'low';
    sec.notes.push('음원과 등록한 영어 본문이 많이 달라 보여요(맞는 단어 ' + Math.round(ratio * 100) + '%). 음원을 들으며 시간을 꼭 확인해 주세요.');
  }
  sec.tokens = toks.map(function(t, i){ return { n: t.norm, s: Core.r2(times[i].s), e: Core.r2(times[i].e) }; });
  // 구절 → 단어 번호 범위
  var phrases = Core.splitPhrasesEn(ctx.text), at = 0, prevEnd = 0;
  phrases.forEach(function(p){
    var cnt = p.split(/\s+/).filter(Boolean).length;
    var a = at, b = Math.min(toks.length - 1, at + cnt - 1);
    at += cnt;
    if(a > b) return;
    var s = times[a].s, e = times[b].e;
    var nextStart = (b + 1 < times.length) ? times[b + 1].s : (E ? E.dur : e + 0.5);
    var prevEndT = (a > 0) ? times[a - 1].e : 0;
    var rs = Core.refineStart(E, s, Math.min(0.3, s - prevEndT - 0.02)), re = Core.refineEnd(E, e, Math.min(0.5, nextStart - e - 0.02));
    if(re - rs < 0.3){ rs = s; re = e; }
    if(rs < prevEnd - 0.05) rs = Math.max(s, prevEnd - 0.05);
    sec.phrases.push(mkRow(p, rs, Math.max(re, rs + 0.3), ratio >= 0.7));
    prevEnd = re;
  });
  if(sec.phrases.length){
    sec.passStart = sec.phrases[0].start; sec.passEnd = sec.phrases[sec.phrases.length-1].end;
  }
  sec.full = { start: sec.passStart, end: sec.passEnd };
  // 핵심 단어
  var kw = Core.keywordCandidatesEn(ctx.text);
  sec.candidates = kw.cands;
  kw.picked.forEach(function(w){ var r = Core.makeWordRow(sec, w); if(r) sec.words.push(r); });
  return sec;
};

/* ----- 중국어 초안 만들기 ----- */
function jaccardChars(a, b){
  var A = {}, B = {}, i, inter = 0, uni = 0;
  Core.hanOnly(a).split('').forEach(function(c){ A[c] = 1; });
  Core.hanOnly(b).split('').forEach(function(c){ B[c] = 1; });
  for(var c in A){ uni++; if(B[c]) inter++; }
  for(var d in B){ if(!A[d]) uni++; }
  return uni ? inter / uni : 0;
}
Core.findFirstPassZh = function(chunks){
  var clean = chunks.filter(function(c){ return Core.hanCount(c.text) > 0; });
  if(clean.length < 2) return clean;
  for(var i=1;i<clean.length;i++){
    if(jaccardChars(clean[0].text, clean[i].text) >= 0.6) return clean.slice(0, i);
  }
  return clean;
};
Core.buildDraftZh = function(ctx){
  var sec = Core.baseSection('zh', ctx), E = ctx.E;
  var pass = Core.findFirstPassZh(ctx.whisper || []);
  var phrases = Core.splitPhrasesZh(ctx.text);
  var regLens = phrases.map(function(p){ return Core.hanCount(p); });
  var totalR = regLens.reduce(function(a, b){ return a + b; }, 0) || 1;
  if(!pass.length){
    sec.quality = 'low';
    sec.notes.push('중국어 소리를 분석하지 못했어요. 음원을 들으며 시간을 직접 지정해 주세요.');
    var dur = E ? E.dur : 20, t = 0;
    phrases.forEach(function(p, i){ var d = dur * regLens[i] / totalR; sec.phrases.push(mkRow(p, t, t + d, false)); t += d; });
  } else {
    var chunkLens = pass.map(function(c){ return Core.hanCount(c.text); });
    var totalW = chunkLens.reduce(function(a, b){ return a + b; }, 0) || 1;
    if(Math.abs(totalW - totalR) / totalR > 0.4){
      sec.quality = 'low';
      sec.notes.push('인식된 글자 수가 등록한 본문과 많이 달라요. 구간 시간을 꼭 들어보고 확인해 주세요.');
    }
    var timeAt = function(f){
      var target = f * totalW, acc = 0, i;
      for(i=0;i<pass.length;i++){
        var c1 = acc + chunkLens[i];
        if(target <= c1 + 1e-9){
          var fr = chunkLens[i] ? (target - acc) / chunkLens[i] : 0;
          return pass[i].t0 + fr * (pass[i].t1 - pass[i].t0);
        }
        acc = c1;
      }
      return pass[pass.length-1].t1;
    };
    var gaps = [];
    for(var gi=0; gi<pass.length-1; gi++){ gaps.push({ g0: pass[gi].t1, g1: pass[gi+1].t0, mid: (pass[gi].t1 + pass[gi+1].t0) / 2 }); }
    var firstStart = Core.refineStart(E, Math.max(0, pass[0].t0 - 0.05));
    var lastEnd = Core.refineEnd(E, pass[pass.length-1].t1);
    if(lastEnd <= pass[pass.length-1].t1) lastEnd = pass[pass.length-1].t1 + 0.1;
    if(E) lastEnd = Math.min(lastEnd, E.dur);
    var bounds = [], cum = 0, prevB = firstStart;
    for(var k=0;k<phrases.length-1;k++){
      cum += regLens[k];
      var tb = timeAt(cum / totalR), pick = null, bd = 0.9;
      gaps.forEach(function(g){ var dd = Math.abs(tb - g.mid); if(dd < bd){ bd = dd; pick = g; } });
      var endT, startT;
      if(E && E.rms.length){
        var lo = pick ? pick.g0 - 0.15 : tb - 0.35, hi = pick ? pick.g1 + 0.15 : tb + 0.35;
        lo = Math.max(prevB + 0.3, lo); if(hi <= lo) hi = lo + 0.1;
        var m = Core.minEnergyTime(E, lo, hi);
        var run = Core.quietRunAround(E, m, 0.6);
        if(run && run.e - run.s >= 0.2){ endT = run.s + 0.05; startT = run.e - 0.05; if(startT < endT) startT = endT; }
        else { endT = startT = m; }
      } else if(pick){
        endT = Math.min(pick.g0 + 0.25, pick.mid); startT = Math.max(pick.g1 - 0.25, pick.mid); if(startT < endT) startT = endT;
      } else { endT = startT = tb; }
      if(endT <= prevB + 0.2){ endT = startT = prevB + 0.25; }
      bounds.push({ e: endT, s: startT });
      prevB = startT;
    }
    var cursor = firstStart;
    phrases.forEach(function(p, i){
      var s = cursor, e = (i < bounds.length) ? bounds[i].e : lastEnd;
      sec.phrases.push(mkRow(p, s, Math.max(e, s + 0.3), true));
      cursor = (i < bounds.length) ? bounds[i].s : lastEnd;
    });
  }
  if(sec.phrases.length){
    sec.passStart = sec.phrases[0].start; sec.passEnd = sec.phrases[sec.phrases.length-1].end;
  }
  sec.full = { start: sec.passStart, end: sec.passEnd };
  sec.phrases.forEach(function(p){ p.pinyin = Core.pinyinOf(p.text); });
  var kw = Core.keywordCandidatesZh(ctx.text);
  sec.candidates = kw.cands;
  kw.picked.forEach(function(w){ var r = Core.makeWordRow(sec, w); if(r) sec.words.push(r); });
  return sec;
};

/* ----- 단어 한 줄 만들기 / 추가 ----- */
Core.makeWordRow = function(sec, text){
  text = String(text || '').trim();
  if(!text) return null;
  var row, s, e;
  if(sec.lang === 'en'){
    var norm = Core.normEn(text), t = null;
    for(var i=0;i<(sec.tokens || []).length;i++){ if(sec.tokens[i].n === norm){ t = sec.tokens[i]; break; } }
    if(t){ s = Math.max(0, t.s - 0.03); e = t.e + 0.06; row = mkRow(text, s, e, true); }
    else { row = mkRow(text, 0, 0, false); }
    return row;
  }
  // 중국어: 구절 안 글자 위치로 대략의 시간을 계산 (소리는 기본 꺼짐: 들어보고 켜기)
  for(var k=0;k<sec.phrases.length;k++){
    var ph = sec.phrases[k], idx = ph.text.indexOf(text);
    if(idx >= 0){
      var hanTotal = Core.hanCount(ph.text) || 1;
      var before = Core.hanCount(ph.text.slice(0, idx)), wl = Core.hanCount(text);
      var dur = ph.end - ph.start;
      row = mkRow(text, ph.start + dur * before / hanTotal, ph.start + dur * (before + wl) / hanTotal, false);
      row.pinyin = Core.pinyinOf(text);
      return row;
    }
  }
  row = mkRow(text, 0, 0, false);
  row.pinyin = Core.pinyinOf(text);
  return row;
};

/* ----- 원문 일치 검사 ----- */
Core.checkOriginal = function(sec){
  var expected = Core.normText(sec.text);
  var actual = Core.normText((sec.phrases || []).map(function(p){ return p.text; }).join(''));
  return { ok: expected === actual, expected: expected, actual: actual };
};

/* ----- Claude가 만들어 준 뜻/병음 붙여넣기 ----- */
Core.parseJsonLoose = function(str){
  str = String(str || '').trim();
  str = str.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  var a = str.indexOf('{'), b = str.lastIndexOf('}');
  if(a < 0 || b < a) throw new Error('JSON을 찾지 못했어요');
  return JSON.parse(str.slice(a, b + 1));
};
Core.applyMeanings = function(sec, json){
  var lang = sec.lang, node = (json && json[lang]) ? json[lang] : (json && (json.words || json.phrases) ? json : null);
  var rep = { wordsSet: 0, phrasesSet: 0, missingPhrases: [], unknownPhrases: [] };
  if(!node) return rep;
  var pyMap = node.pinyin || {};
  if(node.words && typeof node.words === 'object'){
    var keys = Object.keys(node.words), rows = [];
    keys.forEach(function(k){
      var v = node.words[k], ko = (v && typeof v === 'object') ? (v.ko || '') : String(v || '');
      var py = (v && typeof v === 'object' && v.pinyin) ? v.pinyin : (pyMap[k] || '');
      var existing = null;
      (sec.words || []).forEach(function(w){ if(Core.normText(w.text) === Core.normText(k)) existing = w; });
      var row = existing || Core.makeWordRow(sec, k);
      if(!row) return;
      row.ko = ko;
      if(py) row.pinyin = py;
      rows.push(row); rep.wordsSet++;
    });
    if(rows.length) sec.words = rows;
  }
  if(node.phrases && typeof node.phrases === 'object'){
    var byNorm = {};
    Object.keys(node.phrases).forEach(function(k){ byNorm[Core.normText(k)] = { key: k, v: node.phrases[k] }; });
    var used = {};
    (sec.phrases || []).forEach(function(p){
      var hit = byNorm[Core.normText(p.text)];
      if(hit){ p.ko = (hit.v && typeof hit.v === 'object') ? (hit.v.ko || '') : String(hit.v || ''); used[hit.key] = true; rep.phrasesSet++; }
      else { rep.missingPhrases.push(p.text); }
      if(pyMap[p.text]) p.pinyin = pyMap[p.text];
    });
    Object.keys(node.phrases).forEach(function(k){ if(!used[k]) rep.unknownPhrases.push(k); });
  }
  return rep;
};
Core.buildClaudeRequest = function(info){
  var L = [];
  L.push('드림씨드 말씀 연습실 내용을 만들어 주세요. 이번 주 말씀은 ' + (info.ref || '(출처 미입력)') + ' 입니다.');
  L.push('');
  L.push('한글: ' + (info.ko || ''));
  if(info.en) L.push('영어: ' + info.en);
  if(info.zh) L.push('중국어: ' + info.zh);
  L.push('');
  ['en','zh'].forEach(function(lang){
    var s = info.sections && info.sections[lang];
    if(!s) return;
    L.push('[' + (lang === 'en' ? '영어' : '중국어') + ' 구절 목록 - 아래 글자 그대로 키로 사용]');
    s.phrases.forEach(function(p, i){ L.push((i + 1) + '. ' + p.text); });
    L.push('[' + (lang === 'en' ? '영어' : '중국어') + ' 핵심 단어 후보] ' + (s.candidates || []).join(', '));
    L.push('');
  });
  L.push('요청:');
  L.push('1) 아이들(유치부~초등)이 배우기 좋은 핵심 단어/표현 4~6개씩을 골라 주세요. (후보에 없어도 되지만 본문에 실제로 나오는 말이어야 합니다)');
  L.push('2) 단어마다 짧은 한국어 뜻, 구절마다 한국어 뜻(성경 번역에 맞게)을 적어 주세요. 원문을 바꾸거나 의역한 문장을 원문처럼 쓰지 마세요.');
  L.push('3) 중국어는 모든 한자 병음(성조 부호 포함, 글자 수만큼 띄어쓰기)을 "pinyin" 칸에 적어 주세요. 다의어/성조 변화는 신경 써서 확인해 주세요.');
  L.push('4) 아래 JSON 형식 그대로, JSON만 답해 주세요.');
  L.push('{');
  L.push('  "en": { "words": { "단어": "뜻" }, "phrases": { "구절 그대로": "뜻" } },');
  L.push('  "zh": { "words": { "표현": "뜻" }, "phrases": { "구절 그대로": "뜻" }, "pinyin": { "표현 또는 구절 그대로": "bú yào ..." } }');
  L.push('}');
  return L.join('\n');
};

/* ----- 선생님이 올린 소리 파일: 전용 음원 / 단어 낭독 파일 / 줄별 소리 -----
   section.own        = 연습실 전용 전체 음원(있으면 기존 등록 음원 대신 이 파일로 구간을 자르고 재생)
   section.wordsAudio = 단어 낭독 파일(단어를 한 번씩, 사이를 쉬며 읽은 파일)
   row.src            = 'words'(단어 낭독 파일의 wstart~wend 구간) | 'clip'(row.clip 파일 전체) | 없음(전체 음원의 start~end 구간)
   파일은 한 번 올리면 id가 고정(고치지 않음)이라, 게시한 내용이 나중의 편집 때문에 어긋나지 않아요. */
Core.CLIP_LIMITS = { own: 3 * 1024 * 1024, words: 2 * 1024 * 1024, clip: 600 * 1024 };
Core.CLIP_MAXSEC = { own: 180, words: 120, clip: 30 };
Core.newClipId = function(){ return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
Core.validId = function(id){ return typeof id === 'string' && /^[A-Za-z0-9_-]{6,40}$/.test(id); };
Core.cleanMeta = function(m){
  if(!m || typeof m !== 'object' || !Core.validId(m.id)) return null;
  var dur = +m.dur;
  if(!(dur > 0 && dur < 600)) return null;
  var out = { id: m.id, name: String(m.name || '').slice(0, 80), mime: String(m.mime || '').slice(0, 40), len: Math.max(0, Math.round(+m.len || 0)), dur: Core.r2(dur) };
  if(typeof m.forText === 'string' && m.forText) out.forText = m.forText.slice(0, 600);   // 올릴 때 등록돼 있던 말씀(다음 주 말씀에 잘못 쓰이지 않게 하는 표시)
  return out;
};
Core.audioMime = function(file){
  var name = String((file && file.name) || '').toLowerCase(), ext = (name.split('.').pop() || '');
  var map = { mp3: 'audio/mpeg', m4a: 'audio/mp4', mp4: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', webm: 'audio/webm' };
  if(map[ext]) return map[ext];
  var t = String((file && file.type) || '').toLowerCase();
  return t.indexOf('audio/') === 0 ? t.split(';')[0] : '';
};
/* 이 줄이 "소리 파일"로 들려줄 수 있는 모양인지 (파일을 실제로 불러왔는지는 보지 않음). 'clip' | 'words' | 'main' | null */
Core.rowFileKind = function(sec, r){
  if(!r || r.audio === false) return null;
  if(r.src === 'clip') return (r.clip && Core.validId(r.clip.id) && +r.clip.dur > 0) ? 'clip' : null;
  if(r.src === 'words') return (sec && sec.wordsAudio && Core.validId(sec.wordsAudio.id) && typeof r.wstart === 'number' && typeof r.wend === 'number' && r.wend > r.wstart) ? 'words' : null;
  return (typeof r.start === 'number' && typeof r.end === 'number' && r.end > r.start) ? 'main' : null;
};
/* 단어 낭독 파일 자르기: 쉬는 곳(조용한 구간)을 기준으로 단어 n개로 나눔. 정확히 n개로 나뉘는 설정을 못 찾으면 ok:false */
Core.speechRuns = function(E, factor, minGap, minLen){
  var sorted = E.rms.slice().sort(function(a, b){ return a - b; });
  var p95 = sorted[Math.floor(sorted.length * 0.95)] || 0;
  var thr = Math.max(1e-5, factor * p95), fs = E.fs, runs = [], cur = null, quiet = 0, i;
  for(i=0;i<E.rms.length;i++){
    if(E.rms[i] >= thr){ if(!cur) cur = { a: i, b: i }; else cur.b = i; quiet = 0; }
    else if(cur){ quiet++; if(quiet * fs >= minGap){ runs.push(cur); cur = null; quiet = 0; } }
  }
  if(cur) runs.push(cur);
  return runs.map(function(r){ return { s: r.a * fs, e: (r.b + 1) * fs }; }).filter(function(r){ return r.e - r.s >= minLen; });
};
Core.splitWordsFile = function(E, n){
  if(!E || !E.rms || !E.rms.length || !(n > 0)) return { ok: false, found: 0 };
  var factors = [0.1, 0.18, 0.05, 0.3], gaps = [0.6, 0.45, 0.35, 0.28, 0.22], found = null, ref = null, fi, gi;
  for(fi=0; fi<factors.length && !found; fi++){
    for(gi=0; gi<gaps.length; gi++){
      var runs = Core.speechRuns(E, factors[fi], gaps[gi], 0.12);
      if(fi === 0 && gaps[gi] === 0.35) ref = runs.length;
      if(runs.length === n){ found = runs; break; }
    }
  }
  if(!found) return { ok: false, found: ref == null ? 0 : ref };
  var segs = found.map(function(r, i){
    var prevE = i > 0 ? found[i-1].e : 0, nextS = i < found.length - 1 ? found[i+1].s : E.dur;
    var s = Math.max(i > 0 ? (prevE + r.s) / 2 : 0, r.s - 0.08);
    var e = Math.min(i < found.length - 1 ? (r.e + nextS) / 2 : E.dur, r.e + 0.12);
    return { s: Core.r2(s), e: Core.r2(Math.max(e, s + 0.2)) };
  });
  return { ok: true, segs: segs };
};

/* ----- 기기 음성(Web Speech) 줄별 확인 상태 -----
   확인 표시(ttsConf)에는 "그때의 글자·읽을 글자·언어" 서명이 들어가고,
   지금 서명과 다르면(글자나 읽을 글자를 고쳤으면) 자동으로 확인이 풀린 것으로 본다. */
Core.ttsTag = function(lang){ return lang === 'zh' ? 'zh-CN' : 'en-US'; };
Core.speakText = function(lang, row){
  var say = (lang === 'zh') ? String((row && row.say) || '').trim() : '';
  return say || String((row && row.text) || '').trim();
};
Core.ttsSig = function(lang, row){
  return [Core.ttsTag(lang), String((row && row.text) || '').trim(), lang === 'zh' ? String((row && row.say) || '').trim() : ''].join('|');
};
Core.ttsConfirmed = function(lang, row){
  return !!(row && row.ttsConf && row.ttsConf === Core.ttsSig(lang, row));
};

/* ----- 외부 사전 링크 (검색 결과 페이지로 연결만 함. 소리/글은 가져오지 않음) ----- */
Core.dictUrl = function(lang, text){
  var q = String(text || '').replace(/[\s"'“”‘’.,;:!?？！，。；：、()（）\[\]]+/g, lang === 'zh' ? '' : ' ').trim();
  if(!q) return '';
  if(lang === 'zh') return 'https://www.mdbg.net/chinese/dictionary?wdqb=' + encodeURIComponent(q);
  return 'https://dictionary.cambridge.org/search/english/direct/?q=' + encodeURIComponent(q.toLowerCase());
};

/* ----- 브라우저에서만 쓰는 분석 도구 (선생님이 자동 생성을 누를 때) ----- */
Core._asr = null;
Core.loadWhisper = async function(onProg){
  if(Core._asr) return Core._asr;
  var tf = await import(CDN.transformers);
  Core._asr = await tf.pipeline('automatic-speech-recognition', CDN.whisperModel, {
    dtype: 'q8', device: 'wasm',
    progress_callback: function(p){ if(p && p.status === 'progress' && onProg) onProg(p); }
  });
  return Core._asr;
};
Core.decodePcm16k = async function(arrayBuffer){
  var Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  var ctx = new Ctx(1, 16000, 16000);
  var ab = await ctx.decodeAudioData(arrayBuffer);
  var n = ab.length, out = new Float32Array(n), c, i;
  for(c=0;c<ab.numberOfChannels;c++){
    var ch = ab.getChannelData(c);
    for(i=0;i<n;i++) out[i] += ch[i] / ab.numberOfChannels;
  }
  return { pcm: out, sr: ab.sampleRate };
};
Core.runWhisper = async function(pcm, langName){
  var asr = await Core.loadWhisper();
  var r = await asr(pcm, { language: langName, task: 'transcribe', return_timestamps: 'word', chunk_length_s: 30 });
  return (r.chunks || []).map(function(c){
    var t0 = c.timestamp[0], t1 = (c.timestamp[1] == null) ? t0 + 0.3 : c.timestamp[1];
    return { text: c.text, t0: t0, t1: t1 };
  });
};
Core.analyzeAudio = async function(lang, blob, onStatus){
  onStatus('음원을 읽는 중…');
  var buf = await blob.arrayBuffer();
  var d = await Core.decodePcm16k(buf);
  var E = Core.energy(d.pcm, d.sr);
  onStatus('분석 도구를 준비하는 중… (처음 한 번은 약 80MB를 내려받느라 1~2분 걸릴 수 있어요)');
  await Core.loadWhisper(function(p){
    if(p.total) onStatus('분석 도구를 내려받는 중… ' + Math.round(100 * p.loaded / p.total) + '% (' + String(p.file || '').split('/').pop() + ')');
  });
  onStatus('소리를 분석하는 중…');
  var W = await Core.runWhisper(d.pcm, lang === 'en' ? 'english' : 'chinese');
  return { E: E, W: W };
};

/* ----- 음원 Blob 만들기 ----- */
Core.dataUrlToBlob = function(dataUrl){
  var m = /^data:([^;,]+)?(;base64)?,/.exec(dataUrl);
  if(!m) throw new Error('bad data url');
  var mime = m[1] || 'audio/mpeg', raw = dataUrl.slice(m[0].length);
  var bin = m[2] ? atob(raw) : decodeURIComponent(raw);
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
};

/* 올린 파일을 읽어 길이(초)와 (원하면) 소리 크기를 잰다. 읽을 수 없는 파일이면 오류 */
Core.probeAudio = async function(blob, wantEnergy){
  var d = await Core.decodePcm16k(await blob.arrayBuffer());
  return { dur: d.pcm.length / d.sr, E: wantEnergy ? Core.energy(d.pcm, d.sr) : null };
};
Core.blobToDataUrl = function(blob){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(String(fr.result)); };
    fr.onerror = function(){ rej(new Error('파일을 읽지 못했어요')); };
    fr.readAsDataURL(blob);
  });
};
/* ============================================================
   구간 재생기: 전체 MP3 하나에서 [시작~끝] 부분만 정확한 횟수로 재생
   - 새 소리를 누르면 이전 소리는 자동으로 멈춤
   - 오류가 나면 onState(id,'error')로 알려줌
   ============================================================ */
function SegPlayer(audio, hooks){
  var token = 0, timer = null, gapTimer = null, gapRes = null, activeFinish = null, cur = null;
  hooks = hooks || {};
  function emit(id, st, info){ if(hooks.onState) hooks.onState(id, st, info || {}); }
  function clearTimers(){
    if(timer){ clearInterval(timer); timer = null; }
    if(gapTimer){ clearTimeout(gapTimer); gapTimer = null; }
  }
  this.current = function(){ return cur ? cur.id : null; };
  this.isPlaying = function(id){ return !!cur && cur.id === id; };
  this.stop = function(){
    token++;
    clearTimers();
    if(gapRes){ var r = gapRes; gapRes = null; r(false); }
    if(activeFinish){ var f = activeFinish; activeFinish = null; f('cancelled'); }
    try{ audio.pause(); }catch(e){}
    if(cur){ var c = cur; cur = null; emit(c.id, 'idle'); }
  };
  function wait(ms, my){
    return new Promise(function(res){
      gapRes = res;
      gapTimer = setTimeout(function(){ gapTimer = null; gapRes = null; res(my === token); }, ms);
    });
  }
  function playOnce(start, end, rate, my){
    return new Promise(function(res){
      var done = false, progressed = false;
      function finish(v){
        if(done) return; done = true;
        clearTimers(); activeFinish = null;
        audio.removeEventListener('error', onErr);
        audio.removeEventListener('ended', onEnded);
        try{ audio.pause(); }catch(e){}
        res(v);
      }
      function onErr(){ finish('error'); }
      function onEnded(){ finish(my === token ? 'done' : 'cancelled'); }
      activeFinish = finish;
      audio.addEventListener('error', onErr);
      audio.addEventListener('ended', onEnded);
      try{ audio.playbackRate = rate; }catch(e){}
      function go(){
        if(my !== token) return finish('cancelled');
        try{ audio.currentTime = start; }catch(e){}
        var p;
        try{ p = audio.play(); }catch(e){ return finish('error'); }
        if(p && p.catch){ p.catch(function(){ finish('error'); }); }
        var t0 = Date.now(), maxMs = ((end - start) / rate) * 1000 + 4000;
        timer = setInterval(function(){
          if(my !== token) return finish('cancelled');
          if(audio.currentTime > start + 0.05) progressed = true;
          if(audio.currentTime >= end - 0.01) return finish('done');
          if(Date.now() - t0 > maxMs) return finish(progressed ? 'done' : 'error');   // 시간이 전혀 흐르지 않았다면 재생이 안 된 것
        }, 25);
      }
      if(audio.readyState >= 1){ go(); }
      else {
        var h = function(){ audio.removeEventListener('loadedmetadata', h); go(); };
        audio.addEventListener('loadedmetadata', h);
        try{ audio.load(); }catch(e){}
      }
    });
  }
  /* opts: times(반복 횟수), gapMs(반복 사이 쉬는 시간), rate(속도), followMs(끝난 뒤 "따라 말하기" 시간) */
  this.play = function(id, start, end, opts){
    opts = opts || {};
    var times = Math.max(1, opts.times || 1), gap = (opts.gapMs == null) ? 500 : opts.gapMs, rate = opts.rate || 1, follow = opts.followMs || 0;
    this.stop();
    var my = ++token;
    cur = { id: id };
    return (async function(){
      for(var i=1; i<=times; i++){
        if(my !== token) return 'cancelled';
        emit(id, 'playing', { i: i, n: times });
        var r = await playOnce(start, end, rate, my);
        if(r !== 'done'){
          if(my === token){ cur = null; emit(id, r === 'error' ? 'error' : 'idle'); }
          return r;
        }
        emit(id, 'pass', { i: i, n: times });   // 이 번의 재생이 끝까지 정상으로 끝났음
        if(i < times){ var ok = await wait(gap, my); if(!ok) return 'cancelled'; }
      }
      if(follow){
        emit(id, 'follow', { ms: follow });
        var ok2 = await wait(follow, my);
        if(!ok2) return 'cancelled';
      }
      if(my === token){ cur = null; emit(id, 'idle'); }
      return 'done';
    })();
  };
}


/* ============================================================
   기기 음성 (Web Speech API) — 무료, 서버·API 없음
   - 영어는 en-US, 중국어는 zh-CN 음성만 사용
   - "소리가 실제로 시작됐다"는 신호(onstart)가 와야 정상 재생으로 본다
   ============================================================ */
var Tts = {
  voices: [], failed: {}, fails: {}, inited: false,
  supported: function(){ return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); },
  norm: function(l){ return String(l || '').replace('_', '-').toLowerCase(); },
  load: function(){ try{ Tts.voices = window.speechSynthesis.getVoices() || []; }catch(e){ Tts.voices = []; } },
  find: function(lang){
    var want = Core.ttsTag(lang).toLowerCase();
    var list = Tts.voices.filter(function(v){ return Tts.norm(v.lang) === want; });
    var local = list.filter(function(v){ return v.localService; });
    return local[0] || list[0] || null;
  },
  /* 'unsupported' 기기에 음성 기능 없음 · 'failed' 시도했지만 소리가 안 남 · 'novoice' 이 언어 음성 없음 · 'unknown' 목록이 비어 있어 시도해 봐야 앎 · 'ok' */
  state: function(lang){
    if(!Tts.supported()) return 'unsupported';
    if(Tts.failed[lang]) return 'failed';
    if(!Tts.voices.length) return 'unknown';
    return Tts.find(lang) ? 'ok' : 'novoice';
  },
  usable: function(lang){ var s = Tts.state(lang); return s === 'ok' || s === 'unknown'; },
  voiceName: function(lang){ var v = Tts.find(lang); return v ? v.name + ' (' + v.lang + ')' : ''; },
  init: function(){
    if(!Tts.supported()) return Promise.resolve();
    if(!Tts.inited){
      Tts.inited = true;
      try{ window.speechSynthesis.addEventListener('voiceschanged', function(){ Tts.load(); if(typeof onVoicesChanged === 'function') onVoicesChanged(); }); }catch(e){}
    }
    Tts.load();
    if(Tts.voices.length) return Promise.resolve();
    return new Promise(function(res){
      var t = setTimeout(function(){ res(); }, 1200);
      try{ window.speechSynthesis.addEventListener('voiceschanged', function h(){ window.speechSynthesis.removeEventListener('voiceschanged', h); clearTimeout(t); Tts.load(); res(); }); }catch(e){}
    });
  },
  reasonText: function(lang){
    var nm = lang === 'zh' ? '중국어' : '영어', s = Tts.state(lang);
    if(s === 'unsupported') return '이 기기는 소리 내어 읽어 주는 기능이 없어요.';
    if(s === 'failed') return '이 기기에서는 ' + nm + ' 음성이 나오지 않았어요.';
    if(s === 'novoice') return '이 기기에는 ' + nm + ' 음성이 없어요.';
    return '';
  }
};

/* 구간 재생기(SegPlayer)와 같은 모양의 알림(onState)을 내는 음성 재생기 */
function TtsPlayer(hooks){
  var token = 0, cur = null, active = null, gapTimer = null, gapRes = null, startTimer = null, kick = null;
  hooks = hooks || {};
  function emit(id, st, info){ if(hooks.onState) hooks.onState(id, st, info || {}); }
  function clear(){
    if(gapTimer){ clearTimeout(gapTimer); gapTimer = null; }
    if(startTimer){ clearTimeout(startTimer); startTimer = null; }
    if(kick){ clearTimeout(kick); kick = null; }
  }
  this.current = function(){ return cur ? cur.id : null; };
  this.isPlaying = function(id){ return !!cur && cur.id === id; };
  this.stop = function(){
    var had = !!cur || !!active;
    token++;
    clear();
    if(gapRes){ var r = gapRes; gapRes = null; r(false); }
    if(active){ var f = active; active = null; f('cancelled'); }
    if(had){ try{ window.speechSynthesis.cancel(); }catch(e){} }
    if(cur){ var c = cur; cur = null; emit(c.id, 'idle'); }
  };
  function wait(ms, my){
    return new Promise(function(res){
      gapRes = res;
      gapTimer = setTimeout(function(){ gapTimer = null; gapRes = null; res(my === token); }, ms);
    });
  }
  function speakOnce(text, lang, rate, my){
    return new Promise(function(res){
      var done = false, started = false, u;
      function finish(v){
        if(done) return; done = true;
        if(startTimer){ clearTimeout(startTimer); startTimer = null; }
        active = null; res(v);
      }
      try{
        u = new window.SpeechSynthesisUtterance(text);
        u.lang = Core.ttsTag(lang);
        var v = Tts.find(lang); if(v) u.voice = v;
        u.rate = rate || 1;
      }catch(e){ return finish('error'); }
      active = finish;
      u.onstart = function(){ started = true; if(startTimer){ clearTimeout(startTimer); startTimer = null; } };
      u.onend = function(){ finish(my !== token ? 'cancelled' : (started ? 'done' : 'nostart')); };
      u.onerror = function(e){
        var er = e && e.error;
        finish(my !== token || er === 'canceled' || er === 'interrupted' ? 'cancelled' : 'error');
      };
      startTimer = setTimeout(function(){ if(!started && my === token){ finish('nostart'); try{ window.speechSynthesis.cancel(); }catch(e){} } }, 4000);   // 먼저 결과를 확정한 뒤 취소(취소가 일으키는 오류 알림에 덮이지 않도록)
      /* 일부 브라우저는 cancel() 직후 바로 speak()하면 무시하므로 아주 잠깐 뒤에 시작 */
      kick = setTimeout(function(){
        kick = null;
        if(my !== token) return finish('cancelled');
        try{ window.speechSynthesis.speak(u); }catch(e){ finish('error'); }
      }, 40);
      cur && (cur.u = u);   // 소리가 끝날 때까지 발화 객체를 붙잡아 둠(브라우저가 중간에 치우는 문제 방지)
    });
  }
  /* opts: times, gapMs, rate, followMs */
  this.play = function(id, text, lang, opts){
    opts = opts || {};
    var times = Math.max(1, opts.times || 1), gap = (opts.gapMs == null) ? 600 : opts.gapMs, rate = opts.rate || 1, follow = opts.followMs || 0;
    this.stop();
    var my = ++token;
    cur = { id: id, lang: lang };
    return (async function(){
      for(var i = 1; i <= times; i++){
        if(my !== token) return 'cancelled';
        emit(id, 'playing', { i: i, n: times });
        var r = await speakOnce(text, lang, rate, my);
        if(r !== 'done'){
          if(my === token){ cur = null; emit(id, (r === 'error' || r === 'nostart') ? 'error' : 'idle', { reason: r, lang: lang }); }
          return r;
        }
        emit(id, 'pass', { i: i, n: times, lang: lang });
        if(i < times){ var ok = await wait(gap, my); if(!ok) return 'cancelled'; }
      }
      if(follow){
        emit(id, 'follow', { ms: follow });
        var ok2 = await wait(follow, my);
        if(!ok2) return 'cancelled';
      }
      if(my === token){ cur = null; emit(id, 'idle'); }
      return 'done';
    })();
  };
}

   아이용 학습 화면

var $view = document.getElementById('view');

function esc(s){ return Core.esc(s); }
function isHan(c){ return /[一-鿿]/.test(c); }
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function showSprout(emoji, msg){
  var el = document.getElementById('sprout');
  el.innerHTML = '<div class="box"><span class="tree">' + emoji + '</span><div class="msg">' + esc(msg) + '</div></div>';
  el.classList.remove('hidden');
  var hide = function(){ el.classList.add('hidden'); };
  el.onclick = hide;
  clearTimeout(showSprout._t); showSprout._t = setTimeout(hide, 1700);
}

/* ---------- 진행 상태 (이 기기에만 저장, 서버·암송 기록과 무관) ---------- */
function progKey(){ return 'dsStudy:' + (App.child ? App.child.id : 'guest'); }
function progId(sec){ return (sec.audioStamp || '') + '|' + Core.normText(sec.text).slice(0, 40); }
function readProgAll(){ try{ return JSON.parse(lsGet(progKey()) || '{}') || {}; }catch(e){ return {}; } }
function getProg(lang, sec){
  var all = readProgAll(), p = all[lang], id = progId(sec);
  if(!p || p.id !== id) p = { id: id, w: {}, p: {}, steps: {} };
  return p;
}
function saveProg(lang, p){
  if(App.preview) return;
  var all = readProgAll(); all[lang] = p; lsSet(progKey(), JSON.stringify(all));
}

/* ---------- 음원 ---------- */
/* force=true: 이미 받아 둔 음원이 있어도 서버에서 다시 확인 (음원이 도중에 바뀐 것을 놓치지 않기 위해) */
async function ensureAudio(lang, force){
  var a = App.audio[lang];
  if(a && a.status === 'ok' && !force) return a;
  var va = ((App.appState.settings || {}).verseAudio || {})[lang] || {};
  if(!va.uploadedAt){ return (App.audio[lang] = { status: 'missing' }); }
  try{
    var du = await Fb.readAudioDataUrl(lang);
    if(!du) return (App.audio[lang] = { status: 'missing' });
    var blob = Core.dataUrlToBlob(du);
    if(a && a.url){ try{ URL.revokeObjectURL(a.url); }catch(e){} audioEl.setAttribute('data-lang', ''); }
    return (App.audio[lang] = { status: 'ok', blob: blob, url: URL.createObjectURL(blob), stamp: Core.stampOf(va.uploadedAt, du.length), len: du.length });
  }catch(e){
    return (App.audio[lang] = { status: 'error', error: String(e && e.message || e) });
  }
}
function attachAudio(lang){
  var a = App.audio[lang];
  if(a && a.status === 'ok' && audioEl.getAttribute('data-lang') !== lang){
    audioEl.src = a.url; audioEl.setAttribute('data-lang', lang);
    try{ audioEl.load(); }catch(e){}
  }
}

/* ---------- 선생님이 올린 소리 파일(전용 음원 · 단어 낭독 파일 · 줄별 소리) ----------
   파일마다 재생기를 따로 두어(주소를 바꿔 끼우지 않음) 눌렀을 때 바로 소리가 나게 해요. */
App.srcs = {};
var ClipPlayers = {};
function registerClip(id, blob, len){
  var old = App.srcs['c:' + id];
  if(old && old.status === 'ok' && old.url){ try{ ClipPlayers[id] && ClipPlayers[id].stop(); }catch(e){} try{ URL.revokeObjectURL(old.url); }catch(e){} }
  var url = URL.createObjectURL(blob), el = new Audio();
  try{ el.preload = 'auto'; }catch(e){}
  el.src = url;
  ClipPlayers[id] = new SegPlayer(el, { onState: onPlayState });
  return (App.srcs['c:' + id] = { status: 'ok', blob: blob, url: url, len: len, el: el });
}
async function loadClip(id, force){
  var cur = App.srcs['c:' + id];
  if(cur && cur.status === 'ok' && !force) return cur;
  if(!Core.validId(id)) return (App.srcs['c:' + id] = { status: 'error' });
  try{
    var du = await Fb.readClip(id);
    return registerClip(id, Core.dataUrlToBlob(du), du.length);
  }catch(e){
    return (App.srcs['c:' + id] = { status: 'error', error: String(e && e.message || e) });
  }
}
function sectionClipIds(sec){
  var ids = [];
  function add(id){ if(id && ids.indexOf(id) < 0) ids.push(id); }
  if(sec.own) add(sec.own.id);
  (sec.words || []).concat(sec.phrases || []).forEach(function(r){
    if(r.src === 'words' && sec.wordsAudio) add(sec.wordsAudio.id);
    if(r.src === 'clip' && r.clip) add(r.clip.id);
  });
  return ids;
}
async function loadSectionSources(sec, force){
  var ids = sectionClipIds(sec), i = 0;
  async function worker(){ while(i < ids.length){ var id = ids[i++]; await loadClip(id, !!force); } }
  await Promise.all([worker(), worker(), worker()]);
}

/* ---------- 이번 주 말씀이 학습 가능한 상태인지 ---------- */
function verseCard(){ return ((App.appState && App.appState.settings) || {}).verseCard || {}; }
function usableSection(lang){
  var doc = App.docs[lang];
  if(!doc || !doc.published) return { state: 'none' };
  var pub = doc.published, vc = verseCard();
  if(pub.own){
    /* 연습실 전용 음원으로 만든 경우: 구간 시간이 그 파일 기준이라, 설정 화면의 음원이 바뀌어도 영향 없음 */
    if(!Core.cleanMeta(pub.own)) return { state: 'stale' };
    if(Core.normText(pub.text) !== Core.normText(vc[lang])) return { state: 'stale' };
    return { state: 'ready', section: pub };
  }
  var va = (((App.appState.settings || {}).verseAudio) || {})[lang] || {};
  if(!va.uploadedAt) return { state: 'noaudio' };
  if(Core.normText(pub.text) !== Core.normText(vc[lang])) return { state: 'stale' };
  if(Core.stampParts(pub.audioStamp).at !== va.uploadedAt) return { state: 'stale' };
  return { state: 'ready', section: pub };
}

/* ---------- 재생기 ---------- */
var Player = new SegPlayer(audioEl, { onState: onPlayState });
var Voice = new TtsPlayer({ onState: onPlayState });
function stopSounds(){
  Player.stop(); Voice.stop();
  Object.keys(ClipPlayers).forEach(function(id){ ClipPlayers[id].stop(); });
}
function isPlayingAny(pid){
  if(Player.isPlaying(pid) || Voice.isPlaying(pid)) return true;
  return Object.keys(ClipPlayers).some(function(id){ return ClipPlayers[id].isPlaying(pid); });
}
function onVoicesChanged(){ if(App.view === 'admin' && typeof updateVoiceBadges === 'function') updateVoiceBadges(); }
function onPlayState(id, st, info){
  var nodes = document.querySelectorAll('[data-pid="' + id + '"]');
  Array.prototype.forEach.call(nodes, function(el){
    el.classList.toggle('playing', st === 'playing');
    var lab = el.querySelector('.lab');
    if(lab){
      if(!lab.hasAttribute('data-orig')) lab.setAttribute('data-orig', lab.textContent);
      lab.textContent = (st === 'playing' && info.n > 1) ? (info.i + '/' + info.n) : lab.getAttribute('data-orig');
    }
  });
  var fw = document.querySelector('[data-follow="' + id + '"]');
  if(fw){
    if(st === 'follow'){
      fw.classList.remove('hidden');
      var bar = fw.querySelector('i');
      bar.style.transition = 'none'; bar.style.width = '0%';
      void bar.offsetWidth;
      bar.style.transition = 'width ' + (info.ms / 1000) + 's linear'; bar.style.width = '100%';
    } else { fw.classList.add('hidden'); }
  }
  /* "들었어요": 한 번이 끝까지 정상 재생된 경우에만 (실패·취소·중간에 멈춤은 처리하지 않음) */
  if(st === 'pass' && info.i === 1 && id.indexOf('w:') === 0 && App.view === 'lang'){ markHeard(id.split(':')[1]); }
  if(st === 'pass' && info.lang){ Tts.fails[info.lang] = 0; }
  if(st === 'pass' && id.indexOf('adm-tts:') === 0 && typeof admTtsPassed === 'function'){ admTtsPassed(id); }
  if(st === 'error'){
    if(info.lang){
      var nm = info.lang === 'zh' ? '중국어' : '영어';
      if(id.indexOf('adm-tts:') === 0){ toast('이 기기에서 ' + nm + ' 음성이 나오지 않았어요. 다른 기기나 브라우저에서 확인해 보세요.'); }
      else {
        Tts.fails[info.lang] = (Tts.fails[info.lang] || 0) + 1;
        if(Tts.fails[info.lang] >= 2){ Tts.failed[info.lang] = true; if(App.view === 'lang') renderStep(); toast('이 기기에서는 ' + nm + ' 음성이 나오지 않아요. 글자와 뜻으로 배워요.'); }
        else toast('음성이 나오지 않았어요. 한 번 더 눌러 보세요.');
      }
    } else { toast('소리가 나오지 않아요. 다시 눌러 보거나 선생님께 알려 주세요.'); }
  }
}

/* ---------- 병음 붙이기 ---------- */
function rubyHtml(text, pinyinStr, show){
  var syl = String(pinyinStr || '').trim().split(/\s+/).filter(Boolean);
  if(!show || !syl.length) return esc(text);
  var chars = Array.from(String(text || '')), han = chars.filter(isHan).length;
  if(syl.length !== han) return esc(text) + '<div class="py-line">' + esc(pinyinStr) + '</div>';
  var si = 0, cells = [];
  chars.forEach(function(c){
    if(isHan(c)){ cells.push({ py: syl[si++], ch: c }); }
    else if(cells.length){ cells[cells.length - 1].ch += c; }      // 문장부호는 앞 글자 칸에 붙여서 혼자 줄바꿈되지 않게 함
    else { cells.push({ py: '', ch: c }); }
  });
  return cells.map(function(x){
    return '<span class="rb"><span class="rt">' + (x.py ? esc(x.py) : '&nbsp;') + '</span><span class="rc">' + esc(x.ch) + '</span></span>';
  }).join('');
}

/* ---------- 화면: 언어별 학습 ---------- */
async function openLang(lang, section, opts){
  opts = opts || {};
  App.preview = !!opts.preview;
  App.archive = !!opts.archive; App.archFromAdmin = !!opts.fromAdmin;
  App.lang = lang; App.section = section; App.view = 'lang'; App.step = opts.step || 1;
  renderLoading('소리를 불러오는 중…');
  var a = (section.own || App.archive) ? null : await ensureAudio(lang, false);     // 전용 음원이 없을 때만 기존 등록 음원을 씀 · 지난 말씀은 보관한 사본만 사용
  if(a) attachAudio(lang);
  await loadSectionSources(section, false);
  await Tts.init();
  if(a && a.status === 'ok' && !App.preview && Core.stampParts(section.audioStamp).len !== a.len){
    // 음원이 중간에 바뀜: 구간 시간이 어긋나므로 열지 않음
    $view.innerHTML = '<div class="center-msg"><div style="font-size:48px;">🌱</div>새 말씀을 준비하고 있어요.<br>조금만 기다려 주세요.<br><br><button class="btn leaf" data-act="home">돌아가기</button></div>';
    return;
  }
  renderLang();
}
function langAudioOk(){ var a = App.audio[App.lang]; return !!a && a.status === 'ok'; }
/* 소리 파일로 들려주려던 줄인데 파일을 불러오지 못한 줄 수 */
function missingFileRows(){
  var sec = App.section, n = 0;
  (sec.words || []).concat(sec.phrases || [], [sec.full]).forEach(function(r){ if(Core.rowFileKind(sec, r) && !rowFile(r)) n++; });
  return n;
}
function stepsDone(){ return getProg(App.lang, App.section).steps; }

function renderLang(){
  stopEverything(true);
  var L = L10N[App.lang], sec = App.section, done = stepsDone();
  var tabs = [1, 2, 3].map(function(n){
    return '<button class="step-tab ' + (App.step === n ? 'active ' : '') + (done[n] ? 'done' : '') + '" data-act="step" data-n="' + n + '"><span class="no">' + n + '단계</span>' + esc(L.steps[n-1]) + '</button>';
  }).join('');
  var banner = '';
  if(App.preview) banner += '<div class="banner info">👀 미리보기예요. 아이들에게는 아직 안 보이고, 진행 기록도 남지 않아요. <button class="btn small ghost" data-act="admin-back">← 편집으로</button></div>';
  var a = App.audio[App.lang], miss = missingFileRows();
  if(App.archive) banner += '<div class="banner info">📖 지난 말씀이에요.</div>';
  if(App.archive && !sec.own && Arch.usesMain(sec)){
    banner += '<div class="banner warn">이 지난 말씀은 전체 음원이 보관되지 않았어요. 글자로 배워요.</div>';
  } else if(sec.own ? miss > 0 : !langAudioOk()){
    var why = sec.own ? '소리 파일 일부를 불러오지 못했어요.' : ((a && a.status === 'error') ? '소리를 불러오지 못했어요.' : '아직 소리 파일이 없어요.');
    banner += '<div class="banner warn">' + why + ' 글자로 먼저 배워요. <button class="btn small ghost" data-act="retry-audio">다시 불러오기</button></div>';
  } else if(miss > 0){
    banner += '<div class="banner warn">일부 줄의 소리 파일을 불러오지 못했어요. <button class="btn small ghost" data-act="retry-audio">다시 불러오기</button></div>';
  }
  $view.innerHTML =
    '<div class="topbar"><button class="back" data-act="' + (App.preview || App.archFromAdmin ? 'admin-back' : App.archive ? 'arch-back' : 'home') + '">← ' + (App.preview || App.archFromAdmin ? '선생님 화면으로' : App.archive ? '지난 말씀' : '연습실') + '</button><span class="who">' + (App.child && !App.preview ? esc(avatarOf(App.child)) + ' ' + esc(App.child.name) : '') + '</span></div>' +
    '<div class="lang-title"><span style="font-size:36px;">' + L.flag + '</span><h1 class="display">' + L.name + '</h1></div>' + verLineHtml(sec) +
    banner + '<div class="steps">' + tabs + '</div><div id="stepBody"></div>' + creditHtml(sec);
  renderStep();
}

function playBtn(kind, id, mode, label, icon, cls, enabled, extra){
  var pid = kind + ':' + id + ':' + mode;
  return '<button class="pbtn ' + (cls || '') + '" data-act="play" data-kind="' + kind + '" data-id="' + esc(id) + '" data-mode="' + mode + '" data-pid="' + pid + '" ' + (enabled ? '' : 'disabled') + '>' +
    '<span>' + icon + '</span><span class="lab">' + label + '</span></button>';
